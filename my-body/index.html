<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inside My Body — 3D Simulator</title>
<link rel="icon" href="../favicon.ico" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif; overflow:hidden; background:#bfc8e0; color:#fff; }
  #app { position:fixed; inset:0; }
  .hud { position:fixed; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
  .title { font-size:1.4rem; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  .sub { font-size:.85rem; color:#dce2f5; }
  .back { pointer-events:auto; text-decoration:none; color:#fff; background:rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.5); padding:8px 14px; border-radius:999px; font-size:.9rem; }
  .back:hover { background:rgba(0,0,0,.5); }
  .panel { position:fixed; left:16px; top:70px; background:rgba(255,255,255,.95); border:2px solid rgba(30,40,70,.2); border-radius:18px; padding:14px 16px; z-index:15; width:210px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .panel h3 { font-size:1rem; margin-bottom:8px; color:#1a2540; }
  .organ-btn { display:block; width:100%; text-align:left; padding:7px 12px; margin-bottom:6px; border-radius:10px; border:2px solid rgba(30,40,70,.15); background:#f0f3fa; color:#1a2540; font-family:inherit; font-size:.9rem; font-weight:700; cursor:pointer; transition:transform .12s, border-color .12s; }
  .organ-btn:hover { transform:translateX(4px); border-color:#c2452a; }
  .organ-btn.active { background:#ffd166; border-color:#c2452a; }
  .bubble { position:fixed; left:50%; bottom:210px; transform:translateX(-50%); background:rgba(26,32,60,.96); border:3px solid rgba(255,255,255,.4); border-radius:24px; padding:18px 24px; max-width:min(90vw,440px); text-align:center; z-index:20; box-shadow:0 10px 36px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .3s; }
  .bubble.show { opacity:1; pointer-events:auto; }
  .bubble h3 { font-size:1.35rem; margin-bottom:4px; }
  .bubble p { font-size:1.05rem; line-height:1.5; }
  .bubble .sound { margin-top:10px; background:#ffd166; color:#3a2b00; border:none; border-radius:999px; padding:10px 18px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .bubble .close { margin-left:8px; background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:999px; padding:10px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  .hint { position:fixed; bottom:142px; left:50%; transform:translateX(-50%); color:#c8d0e8; font-size:.85rem; text-align:center; z-index:12; pointer-events:none; text-shadow:0 1px 5px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S3.5 15.4 3.5 9.6A4.6 4.6 0 0 1 12 6.9a4.6 4.6 0 0 1 8.5 2.7c0 5.8-8.5 10.9-8.5 10.9Z"/>
    <path d="M4.8 12.5h3l1.6-2.6 2 4.4 1.6-3 1.3 2.2h4.4" opacity=".65"/></svg>Inside My Body<div class="sub">Tap an organ to learn what it does</div></div>
  <a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a>
</div>
<div class="panel">
  <h3>🧠 My amazing body</h3>
  <button class="organ-btn" data-organ="brain">🧠 Brain</button>
  <button class="organ-btn" data-organ="heart">🫀 Heart</button>
  <button class="organ-btn" data-organ="lungs">🫁 Lungs</button>
  <button class="organ-btn" data-organ="stomach">🍽️ Stomach</button>
  <button class="organ-btn" data-organ="bones">🦴 Bones</button>
  <button class="organ-btn" data-organ="muscles">💪 Muscles</button>
</div>
<div class="bubble" id="bubble">
  <h3 id="bTitle"></h3><p id="bText"></p>
  <div><button class="sound" id="bRead">🔊 Read aloud</button><button class="close" id="bClose">✕</button></div>
</div>
<div class="hint">Tap an organ on the body or its button</div>

<link rel="stylesheet" href="../assets/kid-lib.css">
<script type="importmap">
{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script src="../assets/kid-lib.js"></script>
<script src="../assets/models-lib.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;

const ORGANS={
  brain:{ name:'Brain', color:0xf0a8c8, fact:'Your brain is the boss of your whole body. It helps you think, learn, dream, and move!' },
  heart:{ name:'Heart', color:0xe84a4a, fact:'Your heart is a muscle that pumps blood around your body all day, every day — even while you sleep!' },
  lungs:{ name:'Lungs', color:0xf0a8a8, fact:'Your lungs fill with air when you breathe in. They give your body the oxygen it needs!' },
  stomach:{ name:'Stomach', color:0xc88f6a, fact:'Your stomach breaks down the food you eat so your body can use it for energy.' },
  bones:{ name:'Bones', color:0xf5f0e0, fact:'You have 206 bones! They make your skeleton, which holds your body up and protects it.' },
  muscles:{ name:'Muscles', color:0xe0805a, fact:'Muscles pull on your bones so you can run, jump, smile, and hug!' },
};

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xbfc8e0); scene.fog=new THREE.Fog(0xbfc8e0, 20, 50);
const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400); camera.position.set(0,4,14);
const renderer=new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/studio-small.hdr",
  sky: 'gradient',
  skyOptions: { top: 0x2a2a4a, bottom: 0x6a7a9a, sun: new THREE.Vector3(0.3, 0.5, -0.8), sunSize: 60 },
  bloom: 'soft'
});
window.fx = fx;
/* HDR from Realism.setup provides the environment */
KidLib.ambience('soft');
const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.target.set(0,2.6,0); controls.maxDistance=22; controls.minDistance=4;

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sunLight=new THREE.DirectionalLight(0xfff5e0, 1.4); sunLight.position.set(6,10,6); sunLight.castShadow=true; sunLight.shadow.mapSize.set(1024,1024); sunLight.shadow.camera.left=-8; sunLight.shadow.camera.right=8; sunLight.shadow.camera.top=10; sunLight.shadow.camera.bottom=-4; scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9ac0, 0.4));

const floor=new THREE.Mesh(new THREE.CircleGeometry(12,40), new THREE.MeshStandardMaterial({ color:0xb8c0d8, roughness:0.9 })); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// Person
// a real, rigged and animated human figure
const body=new THREE.Group();
const skin=new THREE.MeshStandardMaterial({ color:0xf0c8a0, roughness:0.7 });
ModelsLib.addReal(scene, '../assets/models/person.glb', { targetHeight: 5.4, position:{x:0,y:0,z:0}, name:'person' })
  .then(function(m){ if(m){ m.name='person'; m.userData.isBody=true; } });
// keep a soft body silhouette behind the real figure so the organs read clearly
const silhouette=new THREE.Mesh(new THREE.CapsuleGeometry(0.78,1.7,8,16), new THREE.MeshStandardMaterial({ color:0xf0c8a0, roughness:0.85, transparent:true, opacity:0.16 }));
silhouette.position.y=3.3; body.add(silhouette);
const silhouetteHead=new THREE.Mesh(new THREE.SphereGeometry(0.72,18,18), new THREE.MeshStandardMaterial({ color:0xf0c8a0, roughness:0.85, transparent:true, opacity:0.14 }));
silhouetteHead.position.y=5.25; body.add(silhouetteHead);
body.position.y=0; scene.add(body);

// Organs (glowing translucent)
const organMeshes={};
function pSphere(geo, color, emissive, py){ const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity:0.4, transparent:true, opacity:0.85 })); m.position.y=py; return m; }
const brain=pSphere(new THREE.SphereGeometry(0.5,20,20), 0xf0a8c8,0xf060a0, 5.2); body.add(brain);
const brain2=pSphere(new THREE.SphereGeometry(0.45,20,20), 0xe890b8,0xf060a0, 5.05); body.add(brain2);
// the real brain model, floating where the brain organ is
const realBrain=ModelsLib.addReal(scene, '../assets/models/brain.glb', { targetHeight: 0.95, position:{x:0,y:5.15,z:0.15}, name:'realBrain' });
realBrain.then(function(m){ if(m){ brain.visible=false; brain2.visible=false; } });
const heart=pSphere(new THREE.SphereGeometry(0.28,14,14), 0xe84a4a,0xff3030, 3.7); body.add(heart);
const lungL=pSphere(new THREE.SphereGeometry(0.3,14,14), 0xf0a8a8,0xf08080, 3.6); lungL.position.x=-0.35; body.add(lungL);
const lungR=pSphere(new THREE.SphereGeometry(0.3,14,14), 0xf0a8a8,0xf08080, 3.6); lungR.position.x=0.35; body.add(lungR);
const stomach=pSphere(new THREE.SphereGeometry(0.32,14,14), 0xc88f6a,0xb06040, 2.7); body.add(stomach);
const boneL=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,1.4,10), new THREE.MeshStandardMaterial({ color:0xf5f0e0, emissive:0xccc0a0, emissiveIntensity:0.3 })); boneL.position.set(-0.35,1.2,0); boneL.rotation.z=0.1; body.add(boneL);
const boneR=boneL.clone(); boneR.position.x=0.35; boneR.rotation.z=-0.1; body.add(boneR);
const muscleL=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.6,6,12), new THREE.MeshStandardMaterial({ color:0xe0805a, emissive:0xd06040, emissiveIntensity:0.3, transparent:true, opacity:0.8 })); muscleL.position.set(-1.0,3.0,0); muscleL.rotation.z=0.25; body.add(muscleL);
const muscleR=muscleL.clone(); muscleR.position.x=1.0; muscleR.rotation.z=-0.25; body.add(muscleR);

const organMap={ brain:[brain,brain2], heart:[heart], lungs:[lungL,lungR], stomach:[stomach], bones:[boneL,boneR], muscles:[muscleL,muscleR] };
let current=null;
function showInfo(key){
  current=key;
  document.querySelectorAll('.organ-btn').forEach(b=>b.classList.toggle('active', b.dataset.organ===key));
  const o=ORGANS[key]; document.getElementById('bTitle').textContent=o.name; document.getElementById('bText').textContent=o.fact;
  document.getElementById('bubble').classList.add('show');
}
document.querySelectorAll('.organ-btn').forEach(b=>b.onclick=()=>showInfo(b.dataset.organ));
KidLib.pulse(scene, new THREE.Vector3(0,3.7,0), 0xffd166);
document.getElementById('bClose').onclick=()=>document.getElementById('bubble').classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${document.getElementById('bTitle').textContent}. ${document.getElementById('bText').textContent}`);

// clickable organs
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(body.children,true); for(const h of hits){ for(const key in organMap){ if(organMap[key].includes(h.object)){ showInfo(key); return; } } } });

const clock=new THREE.Clock();
(function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime();
  // breathing
  const br=1+Math.sin(t*1.4)*0.03; silhouette.scale.set(br,1,br);
  // heartbeat
  const hb=1+Math.max(0,Math.sin(t*3.2))*0.35; heart.scale.set(hb,hb,hb);
  // gentle bob
  body.rotation.y=Math.sin(t*0.2)*0.05;
  controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera); })();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const TIPS=[
  'Your body has systems that work together.',
  'Blood carries oxygen and food around your body.',
  'Food gives your body energy to run and play.',
  'Sleep helps your brain and body grow.',
  'Exercise keeps your heart and muscles strong.'
];
const QUIZ=[
  {q:'Which organ pumps your blood?', opts:['Brain','Heart','Stomach'], ans:1},
  {q:'Which organ helps you think?', opts:['Brain','Lungs','Bones'], ans:0},
  {q:'What do you use to breathe?', opts:['Stomach','Lungs','Heart'], ans:1},
  {q:'How many bones does an adult have?', opts:['107','206','509'], ans:1},
  {q:'Where does your food get broken down?', opts:['Brain','Stomach','Muscles'], ans:1}
];
window.__MORE={
  'Brain':['Your brain uses about 20% of your body\'s energy.','It works even while you sleep.'],
  'Heart':['Your heart beats about 100,000 times every day.','It is about the size of your fist.'],
  'Lungs':['You have two lungs, one on each side.','Taking deep breaths fills them with fresh air.'],
  'Stomach':['Your stomach is stretchy and can grow.','Juices in your stomach help break down food.'],
  'Bones':['Babies are born with more bones that later join together.','Bones are alive and grow as you grow.'],
  'Muscles':['You have more than 600 muscles!','Even smiling uses many muscles.']
};
KidLib.init({tips:TIPS, quiz:QUIZ});
</script>
</body>
</html>
