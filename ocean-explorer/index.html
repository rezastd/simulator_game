<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ocean Explorer — 3D Simulator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif; overflow:hidden; background:#041a2c; color:#fff; }
  #app { position:fixed; inset:0; }
  #err { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#5a1020; border:3px solid #ff8f8f; padding:18px 24px; border-radius:14px; color:#ffd2d2; font-size:1rem; display:none; z-index:50; max-width:90vw; }
  .hud { position:fixed; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
  .title { font-size:1.4rem; font-weight:700; text-shadow:0 2px 10px rgba(0,0,0,.8); }
  .sub { font-size:.85rem; color:#8fd0f5; }
  .back { pointer-events:auto; text-decoration:none; color:#fff; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.32); padding:8px 14px; border-radius:999px; font-size:.9rem; }
  .back:hover { background:rgba(255,255,255,.3); }
  .bubble { position:fixed; left:50%; bottom:210px; transform:translateX(-50%); background:rgba(3,20,36,.96); border:3px solid rgba(100,200,255,.45); border-radius:24px; padding:18px 24px; max-width:min(90vw,440px); text-align:center; z-index:20; box-shadow:0 10px 36px rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .3s; }
  .bubble.show { opacity:1; pointer-events:auto; }
  .bubble h3 { font-size:1.35rem; margin-bottom:6px; color:#bfe6ff; }
  .bubble p { font-size:1.05rem; line-height:1.5; }
  .bubble .sound { margin-top:10px; background:#4fc3f7; color:#03202f; border:none; border-radius:999px; padding:10px 18px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .bubble .close { margin-left:8px; background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px; padding:10px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  .strip { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:15; flex-wrap:wrap; justify-content:center; }
  .fish-btn { padding:8px 14px; border-radius:999px; border:3px solid rgba(255,255,255,.35); cursor:pointer; background:rgba(6,30,52,.8); color:#fff; font-family:inherit; font-size:.9rem; font-weight:700; transition:transform .15s, border-color .15s; }
  .fish-btn:hover { transform:scale(1.08); border-color:#fff; }
  .fish-btn.active { border-color:#4fc3f7; box-shadow:0 0 12px rgba(79,195,247,.6); }
  .hint { position:fixed; bottom:142px; left:50%; transform:translateX(-50%); color:#8fd0f5; font-size:.85rem; text-align:center; z-index:12; pointer-events:none; text-shadow:0 1px 5px #000; }
</style>
</head>
<body>
<div id="app"></div>
<div id="err"></div>
<div class="hud">
  <div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 12c0 3-3.1 5.4-6.6 5.4S2 15 2 12s2.9-5.4 5.9-5.4S14.5 9 14.5 12Z"/>
    <path d="M14.5 12c1.9-1.7 3.7-2.9 5.2-3.4v6.8c-1.5-.5-3.3-1.7-5.2-3.4Z"/>
    <circle cx="6.4" cy="10.9" r="1"/>
    <path d="M4.2 8.6c1.2-1.1 2.7-1.7 4.2-1.7"/>
    <circle cx="19" cy="5" r="1.1"/>
    <circle cx="21.4" cy="8.4" r=".7"/></svg>Ocean Explorer<div class="sub">Drag to swim around · tap a creature to learn</div></div>
  <a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a>
</div>
<div class="bubble" id="bubble">
  <h3 id="bTitle"></h3><p id="bText"></p>
  <div><button class="sound" id="bRead">🔊 Read aloud</button><button class="close" id="bClose">✕</button></div>
</div>
<div class="hint">Tap a creature or its button</div>
<div class="strip" id="strip"></div>

<link rel="stylesheet" href="../assets/kid-lib.css">
<script type="importmap">
{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script src="../assets/kid-lib.js"></script>
<script src="../assets/models-lib.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;
try {

const DATA=[
  { name:'Clownfish', color:0xff8c42, accent:0xf5f5f5, size:0.9, kind:'clownfish', fact:'Clownfish hide inside stinging sea anemones — the stings do not hurt them!' },
  { name:'Sea Turtle', color:0x3f8f5f, shell:0x2f5f3f, size:2.2, kind:'turtle', fact:'Sea turtles can live for more than 80 years and swim thousands of miles across the ocean.' },
  { name:'Octopus', color:0xc86a8f, size:1.6, kind:'octopus', fact:'An octopus has eight arms and three hearts, and it can change color to hide from danger!' },
  { name:'Jellyfish', color:0x9f8fff, size:1.3, kind:'jelly', glow:true, fact:'Jellyfish are made mostly of water and have no brain and no bones. They drift with the waves.' },
  { name:'Seahorse', color:0xf2b84f, size:0.8, kind:'seahorse', fact:'Seahorses are tiny fish that swim standing up, and it is the daddy that carries the babies!' },
  { name:'Blue Whale', color:0x3f5f9f, size:5.0, kind:'whale', fact:'The blue whale is the biggest animal on Earth — bigger than any dinosaur that ever lived!' },
  { name:'Dolphin', color:0x7fa8cc, size:2.8, kind:'dolphin', fact:'Dolphins are very smart and talk to each other with clicks and whistles.' },
  { name:'Starfish', color:0xe06b6b, size:0.9, kind:'starfish', fact:'A starfish is not a fish! If it loses an arm, it can grow a brand-new one.' },
];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04314f);
scene.fog=new THREE.Fog(0x04314f, 22, 68);
const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0,7,32);
const renderer=new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/sky-dawn-small.hdr",
  sky: false,  // underwater: keep the deep blue backdrop
  bloom: 'gentle'
});
window.fx = fx;
/* HDR from Realism.setup provides the environment */
KidLib.ambience('waves');
const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.target.set(0,1.5,0); controls.maxDistance=42; controls.minDistance=4;

scene.add(new THREE.AmbientLight(0x2a5a7a, 1.1));
const sun=new THREE.DirectionalLight(0x7cc0ff, 1.6); sun.position.set(5,18,8); sun.castShadow=true; scene.add(sun);
const caustic=new THREE.DirectionalLight(0x9fe0ff, 0.7); scene.add(caustic);
scene.add(new THREE.HemisphereLight(0x3a6a9a, 0x042a44, 0.5));

// --- animated water surface (shimmering waves seen from below) ---
const waterGeo=new THREE.PlaneGeometry(90,90,48,48); waterGeo.rotateX(-Math.PI/2);
const waterMat=new THREE.MeshPhongMaterial({ color:0x3a7ab0, transparent:true, opacity:0.22, side:THREE.DoubleSide, depthWrite:false, shininess:60 });
const water=new THREE.Mesh(waterGeo, waterMat); water.position.y=15; scene.add(water);
const waterPos=waterGeo.attributes.position;

// --- god-ray light shafts ---
(function(){ for(let i=0;i<6;i++){ const shaft=new THREE.Mesh(new THREE.PlaneGeometry(6,20), new THREE.MeshBasicMaterial({ color:0xbfe4ff, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending })); shaft.position.set((i-2.5)*6, 8, -6+Math.random()*7); shaft.rotation.z=0.28+Math.random()*0.2; scene.add(shaft); } })();

// --- sandy floor ---
(function(){ const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d'); g.fillStyle='#d9c193'; g.fillRect(0,0,512,512); for(let i=0;i<3000;i++){ g.fillStyle='rgba(0,0,0,'+(0.02+Math.random()*0.06)+')'; g.beginPath(); g.arc(Math.random()*512,Math.random()*512,1+Math.random()*5,0,7); g.fill(); } for(let i=0;i<120;i++){ g.fillStyle='rgba(200,170,110,0.25)'; g.beginPath(); g.arc(Math.random()*512,Math.random()*512,6+Math.random()*30,0,7); g.fill(); } const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64), new THREE.MeshStandardMaterial({ map:t, roughness:0.95 })); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor); })();

// --- rocks ---
(function(){ for(let n=0;n<10;n++){ const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(0.5+Math.random()*1.2,1), new THREE.MeshStandardMaterial({ color:0x6a5a4a, roughness:0.95, flatShading:true })); rock.position.set((Math.random()-0.5)*32, 0.3, (Math.random()-0.5)*32); rock.scale.y=0.5; rock.castShadow=true; scene.add(rock); } })();

// --- kelp (swaying) ---
const plants=[];
(function(){ const mat=new THREE.MeshStandardMaterial({ color:0x1f7f3f, roughness:0.8 }); for(let n=0;n<30;n++){ const g=new THREE.Group(); const segs=7; const h=3.5+Math.random()*4.5;
    for(let s=0;s<segs;s++){ const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.09*(1-s/segs), 0.13*(1-s/segs)+0.03, h/segs, 7), mat); seg.position.y=(s+0.5)*h/segs; g.add(seg); }
    g.position.set((Math.random()-0.5)*30, 0.1, (Math.random()-0.5)*30); scene.add(g); plants.push({group:g, base:Math.random()*10, h}); } })();

// --- coral + anemones ---
(function(){ for(let n=0;n<22;n++){ const g=new THREE.Group(); const cols=[0xff7070,0xff9f50,0xe86aa0,0x8f5fcf,0xffd166]; const col=cols[(Math.random()*5)|0]; const mat=new THREE.MeshStandardMaterial({ color:col, roughness:0.7 });
    const isAnemone=Math.random()<0.4;
    if(isAnemone){ for(let k=0;k<10;k++){ const a=k/10*Math.PI*2; const tent=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.06,1.0+Math.random()*0.6,6), mat); tent.position.set(Math.cos(a)*0.4, 0.5, Math.sin(a)*0.4); tent.rotation.z=Math.cos(a)*0.4; tent.rotation.x=Math.sin(a)*0.4; g.add(tent); } }
    else { const num=4+Math.random()*5; for(let k=0;k<num;k++){ const s=0.3+Math.random()*0.6; const p=new THREE.Mesh(new THREE.SphereGeometry(s,12,12), mat); p.position.set((Math.random()-0.5)*2.0, s*0.7, (Math.random()-0.5)*2.0); p.scale.y=0.7; g.add(p); } }
    g.position.set((Math.random()-0.5)*30, 0.1, (Math.random()-0.5)*30); scene.add(g); } })();

// --- bubbles rising ---
const bubGeo=new THREE.BufferGeometry(); const bubPos=[]; for(let i=0;i<180;i++) bubPos.push((Math.random()-0.5)*40, Math.random()*15, (Math.random()-0.5)*40);
bubGeo.setAttribute('position', new THREE.Float32BufferAttribute(bubPos,3));
const bubbles=new THREE.Points(bubGeo, new THREE.PointsMaterial({ color:0xcfeaff, size:0.22, transparent:true, opacity:0.55 }));
scene.add(bubbles);

// --- eye helper ---

const REF_SIZE={ clownfish:0.8, fish:0.8, turtle:1.1, octopus:0.8, jelly:0.7, seahorse:0.4, whale:3.2, dolphin:1.4, starfish:0.6 };
function buildCreature(d){
  const builder=ModelsLib.BUILDERS[d.kind];
  if(!builder){ const g=new THREE.Group(); return {group:g, anim:null}; }
  const built=builder(d);
  const g=built.group;
  g.scale.setScalar(d.size/(REF_SIZE[d.kind]||1));
  return built;
}

function findCreatureRoot(obj){
  let o=obj;
  while(o){
    for(let i=0;i<creatures.length;i++){ if(creatures[i].group===o) return i; }
    o=o.parent;
  }
  return -1;
}

const creatures=[];
DATA.forEach((d,i)=>{ const built=buildCreature(d); const g=built.group; g.position.set((Math.random()-0.5)*26, 2.2+Math.random()*4.5, (Math.random()-0.5)*26); g.rotation.y=Math.random()*Math.PI*2; const lbl=KidLib.makeLabel(d.name,{scale:1.3}); lbl.position.y=d.size*2.4+0.8; g.add(lbl); scene.add(g); creatures.push({ data:d, group:g, bob:Math.random()*10, anim:built.anim||null }); });

KidLib.pulse(scene, creatures[0].group.position, 0x4fc3f7);
const strip=document.getElementById('strip');
creatures.forEach((c,idx)=>{ const b=document.createElement('button'); b.className='fish-btn'; b.textContent=c.data.name; b.addEventListener('click',()=>showInfo(idx)); strip.appendChild(b); });
const bubble=document.getElementById('bubble'), bTitle=document.getElementById('bTitle'), bText=document.getElementById('bText');
function showInfo(idx){ const c=creatures[idx]; bTitle.textContent=c.data.name; bText.textContent=c.data.fact; bubble.classList.add('show'); document.querySelectorAll('.fish-btn').forEach(x=>x.classList.remove('active')); strip.children[idx].classList.add('active'); }
document.getElementById('bClose').onclick=()=>bubble.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${bTitle.textContent}. ${bText.textContent}`);

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(scene.children,true); for(const h of hits){ const i=findCreatureRoot(h.object); if(i>=0){ showInfo(i); return; } } });

const clock=new THREE.Clock();
(function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime();
  // wave surface
  const arr=waterPos.array; for(let i=0;i<arr.length;i+=3){ const x=arr[i], z=arr[i+2]; arr[i+1]=Math.sin(x*0.25+t*0.9)*0.7+Math.sin(z*0.2+t*0.7)*0.7+Math.sin((x+z)*0.15+t*0.5)*0.5; }
  waterPos.needsUpdate=true;
  caustic.position.set(6+Math.sin(t*0.5)*4, 18, 8+Math.cos(t*0.4)*4); caustic.intensity=0.5+Math.sin(t*2)*0.2;
  // bubbles rise
  const bp=bubbles.geometry.attributes.position.array; for(let i=1;i<bp.length;i+=3){ bp[i]+=0.03; if(bp[i]>15) bp[i]=0; } bubbles.geometry.attributes.position.needsUpdate=true;
  creatures.forEach((c,i)=>{ c.group.position.y=2.2+Math.sin(t+c.bob)*0.6; c.group.position.x+=Math.sin(t*0.3+i)*0.006;
    if(c.anim){ c.anim(t, i); } else { c.group.rotation.y+=0.008; }
  });
  plants.forEach(p=>{ const sway=Math.sin(t*0.8+p.base)*0.2; p.group.rotation.z=sway; p.group.rotation.x=sway*0.6; });
  controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera); })();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
} catch(err){
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent='Oops! Something went wrong loading the ocean: '+err.message;
}
const TIPS=[
  'The ocean covers about 70% of Earth.',
  'Most of the ocean is still unexplored by people.',
  'Fish breathe with gills, not lungs.',
  'The deepest part of the ocean is the Mariana Trench.',
  'Plankton are tiny plants and animals that feed many sea creatures.'
];
const QUIZ=[
  {q:'Which ocean animal is the biggest of all?', opts:['Blue Whale','Dolphin','Shark'], ans:0},
  {q:'How many arms does an octopus have?', opts:['Six','Eight','Ten'], ans:1},
  {q:'What do fish use to breathe?', opts:['Lungs','Gills','Skin'], ans:1},
  {q:'Who carries the seahorse babies?', opts:['The mommy','The daddy','Both'], ans:1},
  {q:'What is a starfish?', opts:['A fish','Not a fish','A mammal'], ans:1}
];
window.__MORE={
  'Clownfish':['Anemones help protect clownfish from predators.','Clownfish are born male and some become female later in life.'],
  'Sea Turtle':['Sea turtles return to the same beach to lay their eggs.','Their shells are part of their skeleton.'],
  'Octopus':['Octopuses are very smart and can solve puzzles.','Their blood is blue because it uses copper instead of iron.'],
  'Jellyfish':['Jellyfish have been around for over 500 million years.','Some jellyfish glow in the dark.'],
  'Seahorse':['Seahorses change color to match their surroundings.','They are slow swimmers and hold onto seagrass with their tails.'],
  'Blue Whale':['A blue whale\'s heart is as big as a small car.','It eats tiny animals called krill — and lots of them!'],
  'Dolphin':['Dolphins sleep with one eye open.','They use sound to "see" underwater — that is called echolocation.'],
  'Starfish':['Starfish move using tiny tube feet.','They have eyes at the tips of their arms.']
};
KidLib.init({tips:TIPS, quiz:QUIZ});
</script>
</body>
</html>
