<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Trip — 3D Simulator</title>
<link rel="icon" href="../favicon.ico" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif; overflow:hidden; background:#050510; color:#fff; }
  #app { position:fixed; inset:0; }
  .hud { position:fixed; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
  .title { font-size:1.4rem; font-weight:700; text-shadow:0 2px 10px rgba(0,0,0,.9); }
  .sub { font-size:.85rem; color:#98a4ff; }
  .back { pointer-events:auto; text-decoration:none; color:#fff; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3); padding:8px 14px; border-radius:999px; font-size:.9rem; }
  .back:hover { background:rgba(255,255,255,.25); }
  .bubble { position:fixed; left:50%; bottom:210px; transform:translateX(-50%); background:rgba(14,14,44,.95); border:3px solid rgba(140,150,255,.4); border-radius:24px; padding:18px 24px; max-width:min(90vw,440px); text-align:center; z-index:20; box-shadow:0 10px 40px rgba(0,0,0,.7); opacity:0; pointer-events:none; transition:opacity .3s; }
  .bubble.show { opacity:1; pointer-events:auto; }
  .bubble h3 { font-size:1.35rem; margin-bottom:6px; }
  .bubble p { font-size:1.05rem; line-height:1.5; color:#cdd4ff; }
  .bubble .sound { margin-top:10px; background:#ffd166; color:#3a2b00; border:none; border-radius:999px; padding:10px 18px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .bubble .close { margin-left:8px; background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px; padding:10px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  .strip { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:15; flex-wrap:wrap; justify-content:center; }
  .planet-btn { width:48px; height:48px; border-radius:50%; border:3px solid rgba(255,255,255,.35); cursor:pointer; font-size:0; transition:transform .15s, border-color .15s; box-shadow:inset 0 -6px 12px rgba(0,0,0,.5); }
  .planet-btn:hover { transform:scale(1.15); border-color:#fff; }
  .planet-btn.active { border-color:#ffd166; transform:scale(1.22); box-shadow:0 0 16px rgba(255,209,102,.7); }
  .hint { position:fixed; bottom:142px; left:50%; transform:translateX(-50%); color:#98a4ff; font-size:.85rem; text-align:center; z-index:12; pointer-events:none; text-shadow:0 1px 5px #000; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="12" r="5.4"/>
    <ellipse cx="10.5" cy="12" rx="9.4" ry="3" transform="rotate(-22 10.5 12)"/>
    <circle cx="19" cy="5.4" r="1.5"/>
    <path d="M6.4 9.6c1.6-1.1 3.6-1.3 5.4-.6" opacity=".55"/></svg>Space Trip<div class="sub">Drag to look · click a planet to learn</div></div>
  <a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a>
</div>
<div class="bubble" id="bubble">
  <h3 id="bTitle"></h3><p id="bText"></p>
  <div><button class="sound" id="bRead">🔊 Read aloud</button><button class="close" id="bClose">✕</button></div>
</div>
<div class="hint">Tap a planet or its button below</div>
<div class="strip" id="strip"></div>

<link rel="stylesheet" href="../assets/kid-lib.css">
<script type="importmap">
{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script src="../assets/kid-lib.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;

// ---------- procedural texture helpers ----------
function canvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function planetTex(draw, w=256, h=128){
  const c=canvas(w,h), g=c.getContext('2d');
  draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// rocky: noise patches
function rocky(base, dark){
  return planetTex((g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){ g.fillStyle=Math.random()<0.5?dark:(dark=='rgba(0,0,0,0.25)'?base:'rgba(0,0,0,0.22)'); g.globalAlpha=0.3+Math.random()*0.5; g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 1+Math.random()*6, 0, 7); g.fill(); }
    g.globalAlpha=1;
  });
}
// gas giant bands
function gas(colors){
  return planetTex((g,w,h)=>{
    let last=colors[0];
    for(let y=0;y<h;y++){ if(Math.random()<0.12) last=colors[(Math.random()*colors.length)|0]; g.fillStyle=last; g.fillRect(0,y,w,2); }
    for(let i=0;i<120;i++){ g.fillStyle='rgba(255,255,255,0.08)'; g.beginPath(); g.ellipse(Math.random()*w, Math.random()*h, 30+Math.random()*60, 4, 0,0,7); g.fill(); }
  });
}
// earth: continents on blue
function earthTex(){
  return planetTex((g,w,h)=>{
    g.fillStyle='#1f5da8'; g.fillRect(0,0,w,h);
    for(let i=0;i<7;i++){ g.fillStyle='#3f8f4a'; const cx=Math.random()*w, cy=Math.random()*h, r=20+Math.random()*40;
      for(let k=0;k<40;k++){ g.beginPath(); g.arc(cx+(Math.random()-0.5)*r, cy+(Math.random()-0.5)*r, 3+Math.random()*12,0,7); g.fill(); } }
    g.fillStyle='rgba(255,255,255,0.55)'; for(let i=0;i<70;i++){ g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 1+Math.random()*5,0,7); g.fill(); }
  });
}
// ring texture
function ringTex(){
  return planetTex((g,w,h)=>{
    g.fillStyle='rgba(0,0,0,0)'; g.fillRect(0,0,w,h);
    // concentric translucent bands, not filled discs
    for(let r=6;r<128;r+=3+Math.random()*5){
      g.strokeStyle='rgba(218,196,146,'+(0.25+Math.random()*0.55)+')';
      g.lineWidth=1+Math.random()*3;
      g.beginPath(); g.arc(w/2,h/2,r,0,Math.PI*2); g.stroke();
    }
  }, 256,256);
}

const DATA=[
  { name:'Mercury', color:0xb0a89a, size:0.9, dist:4.2, speed:4.0, tilt:0.03, tex:rocky('#a89e8f','rgba(0,0,0,0.25)'), fact:'Mercury is the smallest planet and the closest to the Sun. A year there is only 88 days!' },
  { name:'Venus', color:0xe8c170, size:1.3, dist:6.2, speed:3.1, tilt:-3.1, tex:gas(['#e8c170','#d9ae5a','#f0d48a','#d4a04a']), fact:'Venus is the hottest planet — its thick clouds trap heat and make it a giant greenhouse.' },
  { name:'Earth', color:0x5a9de8, size:1.4, dist:8.4, speed:2.5, tilt:0.41, tex:earthTex(), moon:true, fact:'Earth is our home! It is the only planet we know with life, oceans, and blue skies.' },
  { name:'Mars', color:0xd9714f, size:1.1, dist:10.5, speed:2.0, tilt:0.44, tex:rocky('#d9714f','rgba(90,30,10,0.35)'), fact:'Mars is the red planet. It has the tallest volcano in the whole solar system — Olympus Mons!' },
  { name:'Jupiter', color:0xd8a05a, size:3.0, dist:15.0, speed:1.1, tilt:0.05, tex:gas(['#d8a05a','#c98a48','#e8c088','#a86a38','#f0d8b0']), fact:'Jupiter is the biggest planet — 1,300 Earths could fit inside it! It has a giant red storm.' },
  { name:'Saturn', color:0xe6cf8f, size:2.5, dist:19.5, speed:0.8, tilt:0.47, tex:gas(['#e6cf8f','#d8bd80','#f0ddab','#c9ad70']), ring:true, fact:'Saturn has the most beautiful rings — they are made of billions of chunks of ice and rock.' },
  { name:'Uranus', color:0x8fd6d8, size:1.8, dist:24.0, speed:0.5, tilt:1.7, tex:gas(['#8fd6d8','#7fc4c8','#a8e4e6']), fact:'Uranus spins on its side, like a ball rolling around the Sun.' },
  { name:'Neptune', color:0x4f6fd9, size:1.7, dist:28.0, speed:0.4, tilt:0.1, tex:gas(['#4f6fd9','#4a63c8','#5f7fe8']), fact:'Neptune is the farthest planet — it is very cold, with winds faster than any on Earth.' },
];

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);
camera.position.set(6, 14, 36);
const renderer=new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: null,
  sky: false,
  bloom: 'glow'
});
window.fx = fx;
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment()).texture;
KidLib.ambience('space');
const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.maxDistance=64; controls.minDistance=5;

// Sun with glow
const sun=new THREE.Mesh(new THREE.SphereGeometry(2.2,48,48), new THREE.MeshStandardMaterial({ color:0xffe08a, emissive:0xffa020, emissiveIntensity:1.6, roughness:0.4 }));
scene.add(sun);
const glowTex = (()=>{ const c=canvas(128,128), g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,220,150,1)'); gr.addColorStop(0.3,'rgba(255,180,80,0.6)'); gr.addColorStop(1,'rgba(255,140,40,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, transparent:true, depthWrite:false }));
sunGlow.scale.set(14,14,1); sun.add(sunGlow);
const sunLight=new THREE.PointLight(0xfff0d8, 2.5, 200); sun.add(sunLight);
scene.add(new THREE.AmbientLight(0x223355, 0.5));
scene.add(new THREE.HemisphereLight(0x334488, 0x050510, 0.4));

// starfield with varied sizes/colors
(function(){ const g=new THREE.BufferGeometry(); const pos=[],col=[],sz=[]; for(let i=0;i<2200;i++){ pos.push((Math.random()-0.5)*400,(Math.random()-0.5)*400,(Math.random()-0.5)*400); const w=0.6+Math.random()*0.4; col.push(w, w, w*(0.9+Math.random()*0.1)); sz.push(0.3+Math.random()*1.4); } g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.setAttribute('size',new THREE.Float32BufferAttribute(sz,1)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size:1.2, vertexColors:true, sizeAttenuation:true, transparent:true, opacity:0.95 }))); })();

// planets
const planets=[];
DATA.forEach((d,i)=>{ const group=new THREE.Group();
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(d.size,48,48), new THREE.MeshStandardMaterial({ map:d.tex, roughness:0.85, metalness:0.05 }));
  mesh.castShadow=true;
  mesh.rotation.z=d.tilt||0; group.add(mesh);
  if(d.name==='Earth'){ const atm=new THREE.Mesh(new THREE.SphereGeometry(d.size*1.12,32,32), new THREE.MeshBasicMaterial({ color:0x66aaff, transparent:true, opacity:0.22, side:THREE.BackSide, depthWrite:false })); mesh.add(atm); }
  if(d.ring){ const ring=new THREE.Mesh(new THREE.RingGeometry(d.size*1.5, d.size*2.5, 72), new THREE.MeshBasicMaterial({ map:ringTex(), side:THREE.DoubleSide, transparent:true, opacity:0.95 })); ring.rotation.x=Math.PI/2; ring.rotation.y=0.3; group.add(ring); }
  if(d.moon){ const moon=new THREE.Mesh(new THREE.SphereGeometry(0.35,24,24), new THREE.MeshStandardMaterial({ color:0xaaaaaa, roughness:1 })); moon.position.set(d.size*1.8,0.4,0); group.add(moon); group.userData.moon=moon; }
  const orbit=new THREE.Mesh(new THREE.RingGeometry(d.dist-0.04, d.dist+0.04, 96), new THREE.MeshBasicMaterial({ color:0x445588, side:THREE.DoubleSide, transparent:true, opacity:0.35 })); orbit.rotation.x=-Math.PI/2; scene.add(orbit);
  const lbl=KidLib.makeLabel(d.name,{scale:1.2}); lbl.position.y=d.size+1.1; group.add(lbl);
  scene.add(group); planets.push({ data:d, group, mesh });
});

// buttons
KidLib.pulse(scene, sun.position, 0xffd166);
const strip=document.getElementById('strip');
planets.forEach((p,idx)=>{ const b=document.createElement('button'); b.className='planet-btn'; b.style.background='#'+p.data.color.toString(16).padStart(6,'0'); b.title=p.data.name; b.dataset.i=idx; b.addEventListener('click',()=>showInfo(idx)); strip.appendChild(b); });

const bubble=document.getElementById('bubble'), bTitle=document.getElementById('bTitle'), bText=document.getElementById('bText');
function showInfo(idx){ const p=planets[idx]; bTitle.textContent=p.data.name; bText.textContent=p.data.fact; bubble.classList.add('show'); document.querySelectorAll('.planet-btn').forEach(x=>x.classList.remove('active')); strip.children[idx].classList.add('active'); }
document.getElementById('bClose').onclick=()=>bubble.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${bTitle.textContent}. ${bText.textContent}`);

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
function findPlanetRoot(obj){
  let o=obj;
  while(o){
    for(let i=0;i<planets.length;i++){ if(planets[i].group===o) return i; }
    o=o.parent;
  }
  return -1;
}
renderer.domElement.addEventListener('pointerdown',e=>{ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(scene.children,true); for(const h of hits){ const i=findPlanetRoot(h.object); if(i>=0){ showInfo(i); return; } } });

const clock=new THREE.Clock();
(function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime();
  sun.rotation.y=t*0.05; sunGlow.material.rotation=t*0.02;
  planets.forEach(p=>{ const d=p.data; p.group.position.x=Math.cos(t*d.speed)*d.dist; p.group.position.z=Math.sin(t*d.speed)*d.dist; p.mesh.rotation.y=t*0.3; if(p.group.userData.moon){ const m=p.group.userData.moon; m.position.set(Math.cos(t*4)*d.size*1.8, 0.4, Math.sin(t*4)*d.size*1.8); } });
  controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera); })();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const TIPS=[
  'The Sun is a star — it gives us light and heat.',
  'All the planets travel around the Sun on paths called orbits.',
  'Earth sits in the "Goldilocks zone" — not too hot, not too cold.',
  'You would weigh less on Mars because it has less gravity.',
  'There are 8 planets in our solar system.'
];
const QUIZ=[
  {q:'Which planet is closest to the Sun?', opts:['Mercury','Venus','Mars'], ans:0},
  {q:'Which planet has beautiful rings?', opts:['Jupiter','Saturn','Earth'], ans:1},
  {q:'Which planet is our home?', opts:['Mars','Venus','Earth'], ans:2},
  {q:'Which is the biggest planet?', opts:['Saturn','Jupiter','Neptune'], ans:1},
  {q:'Which planet is called the Red Planet?', opts:['Mars','Mercury','Uranus'], ans:0}
];
window.__MORE={
  'Mercury':['It has no moons and is covered in craters, just like our Moon.','A day on Mercury lasts almost 59 Earth days!'],
  'Venus':['Venus spins the opposite way from Earth.','It is sometimes called Earth\'s twin because it is a similar size.'],
  'Earth':['Earth spins once every 24 hours — that makes day and night.','Our Moon pulls on the oceans and helps make tides.'],
  'Mars':['Mars has ice caps made of water and frozen carbon dioxide.','Robots like the rover Perseverance are exploring Mars right now.'],
  'Jupiter':['Jupiter has more than 90 moons!','Its Great Red Spot is a giant storm bigger than Earth.'],
  'Saturn':['Saturn is so light it could float in water — if we had a big enough ocean.','It has more than 140 moons.'],
  'Uranus':['Uranus is the coldest planet, even colder than Neptune.','Its rings are faint and very hard to see.'],
  'Neptune':['Neptune has the fastest winds in the solar system — over 2,000 km/h!','It was found with math before humans saw it through a telescope.']
};
KidLib.init({tips:TIPS, quiz:QUIZ});
</script>
</body>
</html>
