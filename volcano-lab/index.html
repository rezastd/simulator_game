<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Volcano Lab — 3D Simulator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif;overflow:hidden;background:#d8a888;color:#fff}
  #app{position:fixed;inset:0}
  #err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#5a1020;border:3px solid #ff8f8f;padding:18px 24px;border-radius:14px;color:#ffd2d2;font-size:1rem;display:none;z-index:50;max-width:90vw}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  .title{font-size:1.4rem;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .sub{font-size:.85rem;color:#ffe8d8}
  .back{pointer-events:auto;text-decoration:none;color:#fff;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.5);padding:8px 14px;border-radius:999px;font-size:.9rem}
  .back:hover{background:rgba(0,0,0,.5)}
  .bubble{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:rgba(60,25,15,.97);border:3px solid rgba(255,180,120,.5);border-radius:24px;padding:18px 24px;max-width:min(90vw,440px);text-align:center;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  .bubble.show{opacity:1;pointer-events:auto}
  .bubble h3{font-size:1.35rem;margin-bottom:6px;color:#ffe0c8}
  .bubble p{font-size:1.05rem;line-height:1.5}
  .bubble .sound{margin-top:10px;background:#ffa05a;color:#3a1508;border:none;border-radius:999px;padding:10px 18px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
  .bubble .close{margin-left:8px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:1rem;cursor:pointer;font-family:inherit}
  .panel{position:fixed;right:14px;top:64px;width:220px;background:rgba(60,25,15,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:16px;z-index:15;box-shadow:0 12px 36px rgba(0,0,0,.45)}
  .panel h3{font-size:1.05rem;margin-bottom:10px}
  .act{display:flex;gap:8px}
  .act button{flex:1;padding:10px 8px;border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;transition:transform .12s}
  .act .erupt{background:linear-gradient(135deg,#ff5a3a,#c8381a);color:#fff}
  .act .reset{background:rgba(255,255,255,.16);color:#fff}
  .act button:hover{transform:translateY(-2px)}
  .info{margin-top:10px;font-size:.85rem;color:#ffe0c8;min-height:1.4em;line-height:1.4}
  .hint{position:fixed;bottom:142px;left:50%;transform:translateX(-50%);color:#ffe8d8;font-size:.85rem;text-align:center;z-index:12;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app"></div><div id="err"></div>
<div class="hud"><div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19.5 9 8h6l7 11.5Z"/>
    <path d="M9 8c.6-1.4 1.4-1.4 2-2.4M12 8c.6-1.6 1.6-1.6 2.2-2.6"/>
    <circle cx="9.6" cy="4" r="1"/>
    <circle cx="13.4" cy="2.6" r=".8"/>
    <path d="M4.5 15.5h15" opacity=".45"/></svg>Volcano Lab<div class="sub">Make the volcano erupt and learn about rocks</div></div><a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a></div>
<div class="panel"><h3>🌋 Volcano Lab</h3><div class="act"><button class="erupt" id="eruptBtn">💥 Erupt</button><button class="reset" id="resetBtn">Reset</button></div><div class="info" id="info">Press Erupt to see it blow!</div></div>
<div class="bubble" id="bubble"><h3 id="bTitle"></h3><p id="bText"></p><div><button class="sound" id="bRead">🔊 Read aloud</button><button class="close" id="bClose">✕</button></div></div>
<div class="hint">Tap the volcano or the rock samples to learn</div>
<link rel="stylesheet" href="../assets/kid-lib.css">
<script src="../assets/kid-lib.js"></script>
<script type="importmap">{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;
try {
const ROCKS=[
  {name:'Basalt',color:0x3a3a3a,fact:'Basalt is dark volcanic rock found after lava cools down.'},
  {name:'Pumice',color:0xc8c0b8,fact:'Pumice is a light rock full of bubbles — it can float on water!'},
  {name:'Obsidian',color:0x1a1a2a,fact:'Obsidian is shiny black volcanic glass, formed very fast.'},
  {name:'Granite',color:0x8a8a8a,fact:'Granite is a hard rock with colorful specks, often used in buildings.'},
  {name:'Limestone',color:0xe0dcc8,fact:'Limestone forms from tiny sea shells pressed together over time.'},
  {name:'Sandstone',color:0xc8a878,fact:'Sandstone is made of squashed grains of sand.'}
];
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd8a888);scene.fog=new THREE.Fog(0xd8a888,40,100);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,400);camera.position.set(0,9,30);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/sky-sunset-small.hdr",
  sky: 'gradient',
  skyOptions: { top: 0x8a3a2a, bottom: 0xf0c89a, sun: new THREE.Vector3(-0.5, 0.28, -0.82), sunSize: 150 },
  bloom: 'glow'
});
window.fx = fx;/* HDR from Realism.setup provides the environment */KidLib.ambience('wind');
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,3,0);controls.maxDistance=50;controls.minDistance=6;
scene.add(new THREE.AmbientLight(0xffd8b8,0.85));
const sun=new THREE.DirectionalLight(0xfff0d0,1.6);sun.position.set(10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffe0cc,0x8a5a3a,0.5));
// ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,56),new THREE.MeshStandardMaterial({color:0x8a6a4a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// volcano cone
const volcano=new THREE.Group();
const cone=new THREE.Mesh(new THREE.ConeGeometry(4,6,24),new THREE.MeshStandardMaterial({color:0x6a4a3a,roughness:0.95,flatShading:true}));cone.position.y=3;cone.castShadow=true;volcano.add(cone);
const crater=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.6,0.5,20),new THREE.MeshStandardMaterial({color:0x3a2418}));crater.position.y=6.2;volcano.add(crater);
volcano.position.set(0,0,-4);scene.add(volcano);
// lava particles
const L=500,lg=new THREE.BufferGeometry();const lp=[];for(let i=0;i<L;i++)lp.push(0,7,0);lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
const lava=new THREE.Points(lg,new THREE.PointsMaterial({color:0xffa030,size:0.5}));scene.add(lava);
// smoke
const S=200,sg=new THREE.BufferGeometry();const sp=[];for(let i=0;i<S;i++)sp.push(0,7,0);sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const smoke=new THREE.Points(sg,new THREE.PointsMaterial({color:0x555555,size:0.8,transparent:true,opacity:0.6}));scene.add(smoke);
let erupting=false;
function buildRock(r){const g=new THREE.Group();const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(0.6,1),new THREE.MeshStandardMaterial({color:r.color,roughness:0.9,flatShading:true}));rock.position.y=0.6;rock.castShadow=true;g.add(rock);return g;}
const rocks=[];
ROCKS.forEach((r,i)=>{const g=buildRock(r);const a=i/ROCKS.length*Math.PI*2;g.position.set(Math.cos(a)*9,0,Math.sin(a)*9);g.rotation.y=-a;const lbl=KidLib.makeLabel(r.name,{scale:1.1});lbl.position.y=1.5;g.add(lbl);scene.add(g);rocks.push({data:r,group:g});});
KidLib.pulse(scene, rocks[0].group.position);
const info=document.getElementById('info');
document.getElementById('eruptBtn').onclick=()=>{erupting=true;info.textContent='💥 Boooooom! It is erupting!';setTimeout(()=>{erupting=false;info.textContent='Aaah, that was a big eruption!';},4000);};
document.getElementById('resetBtn').onclick=()=>{erupting=false;info.textContent='Volcano is calm. Press Erupt to start again!';};
const bubble=document.getElementById('bubble'),bTitle=document.getElementById('bTitle'),bText=document.getElementById('bText');
function showRock(i){const r=rocks[i];bTitle.textContent=r.data.name;bText.textContent=r.data.fact;bubble.classList.add('show');}
document.getElementById('bClose').onclick=()=>bubble.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${bTitle.textContent}. ${bText.textContent}`);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(scene.children,true);for(const h of hits){for(let i=0;i<rocks.length;i++){if(rocks[i].group.children.includes(h.object)){showRock(i);return;}}}});
const clock=new THREE.Clock();
(function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  const lap=lava.geometry.attributes.position.array;for(let i=0;i<L;i++){if(erupting){if(lap[i*3+1]>9){lap[i*3]=(Math.random()-0.5)*5;lap[i*3+1]=7;lap[i*3+2]=(Math.random()-0.5)*5;}lap[i*3+1]+=0.12;lap[i*3]+=Math.sin(t*2+i)*0.02;}else{lap[i*3+1]=-1;}}lava.geometry.attributes.position.needsUpdate=true;
  const sap=smoke.geometry.attributes.position.array;for(let i=0;i<S;i++){if(erupting){if(sap[i*3+1]>14){sap[i*3]=(Math.random()-0.5)*3;sap[i*3+1]=7;sap[i*3+2]=(Math.random()-0.5)*3;}sap[i*3+1]+=0.06;sap[i*3]+=Math.sin(t+i)*0.02;}else{sap[i*3+1]=-1;}}smoke.geometry.attributes.position.needsUpdate=true;
  rocks.forEach(r=>r.group.rotation.y+=0.004);
  controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera);})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
} catch(err){document.getElementById('err').style.display='block';document.getElementById('err').textContent='Oops! Something went wrong: '+err.message;}
</script>
<script>
const TIPS=['Beneath the ground it is very hot.','Volcanoes are openings where hot rock escapes the Earth.','Lava is melted rock that flows out.','Hot rock underground is called magma.','Volcanoes help build new land.'];
const QUIZ=[{q:'What is hot melted rock above ground called?',opts:['Lava','Magma','Ice'],ans:0},{q:'What is hot rock underground called?',opts:['Lava','Magma','Stone'],ans:1},{q:'Which rock can float?',opts:['Pumice','Granite','Basalt'],ans:0},{q:'Volcanoes build what?',opts:['New land','Clouds','Rivers'],ans:0},{q:'Obsidian is a shiny rock made of?',opts:['Volcanic glass','Sand','Shells'],ans:0}];
window.__MORE={'Basalt':['Basalt makes up most of the ocean floor.','It is very tough and heavy.'],'Pumice':['Pumice has air bubbles from gas in lava.','It is used to scrub things.'],'Obsidian':['Obsidian forms when lava cools almost instantly.','Ancient people made sharp tools from it.'],'Granite':['Granite is found deep inside mountains.','It is very hard and lasts a long time.'],'Limestone':['Limestone often has fossils in it.','It is used to make cement.'],'Sandstone':['Sandstone forms in layers.','Look closely and you can see the grains.' ]};
KidLib.init({tips:TIPS,quiz:QUIZ});
</script>
</body>
</html>
