<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robo Town — 3D Simulator</title>
<link rel="icon" href="../favicon.ico" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif;overflow:hidden;background:#1a1a2e;color:#fff}
  #app{position:fixed;inset:0}
  #err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#5a1020;border:3px solid #ff8f8f;padding:18px 24px;border-radius:14px;color:#ffd2d2;font-size:1rem;display:none;z-index:50;max-width:90vw}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  .title{font-size:1.4rem;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .sub{font-size:.85rem;color:#b8c0e8}
  .back{pointer-events:auto;text-decoration:none;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.32);padding:8px 14px;border-radius:999px;font-size:.9rem}
  .back:hover{background:rgba(255,255,255,.3)}
  .bubble{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:rgba(20,20,48,.97);border:3px solid rgba(160,120,255,.5);border-radius:24px;padding:18px 24px;max-width:min(90vw,440px);text-align:center;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .3s}
  .bubble.show{opacity:1;pointer-events:auto}
  .bubble h3{font-size:1.35rem;margin-bottom:6px;color:#e0d0ff}
  .bubble p{font-size:1.05rem;line-height:1.5}
  .bubble .sound{margin-top:10px;background:#c88fff;color:#1a1030;border:none;border-radius:999px;padding:10px 18px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
  .bubble .close{margin-left:8px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:1rem;cursor:pointer;font-family:inherit}
  .strip{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:15;flex-wrap:wrap;justify-content:center}
  .btn{padding:8px 14px;border-radius:999px;border:3px solid rgba(255,255,255,.4);cursor:pointer;background:rgba(30,30,70,.85);color:#fff;font-family:inherit;font-size:.9rem;font-weight:700;transition:transform .15s,border-color .15s}
  .btn:hover{transform:scale(1.08);border-color:#fff}
  .btn.active{border-color:#c88fff;box-shadow:0 0 12px rgba(200,143,255,.6)}
  .hint{position:fixed;bottom:142px;left:50%;transform:translateX(-50%);color:#b8c0e8;font-size:.85rem;text-align:center;z-index:12;pointer-events:none;text-shadow:0 1px 5px #000}
</style>
</head>
<body>
<div id="app"></div><div id="err"></div>
<div class="hud"><div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7.5" width="16" height="12" rx="3"/>
    <path d="M12 3.5v4"/>
    <circle cx="12" cy="3" r="1.3"/>
    <circle cx="9" cy="12.5" r="1.4"/>
    <circle cx="15" cy="12.5" r="1.4"/>
    <path d="M9.5 16.3h5"/>
    <path d="M2 12v3M22 12v3"/></svg>Robo Town<div class="sub">Tap a robot or machine to learn how it works</div></div><a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a></div>
<div class="bubble" id="bubble"><h3 id="bTitle"></h3><p id="bText"></p><div><button class="sound" id="bRead">🔊 Read aloud</button><button class="close" id="bClose">✕</button></div></div>
<div class="hint">Tap a robot or its button</div><div class="strip" id="strip"></div>
<link rel="stylesheet" href="../assets/kid-lib.css">
<script src="../assets/kid-lib.js"></script>
<script src="../assets/models-lib.js"></script>
<script type="importmap">{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;
try {
const DATA=[
  {name:'Helper Bot',color:0x6fb0ff,y:1.2,real:{url:'../assets/models/robot.glb',height:1.6},fact:'Helper bots are robots built to do tasks like cleaning or carrying things.'},
  {name:'Spot Robot',color:0xffb347,y:0.6,fact:'Spot is a robot that walks on four legs, just like a friendly dog.'},
  {name:'Robot Arm',color:0xe8e8f0,y:1.4,fact:'A robot arm can move, grab, and lift things with precision.'},
  {name:'Drone',color:0x8a8a8a,y:2.2,fact:'A drone is a small flying robot with spinning rotors that lift it up.'},
  {name:'Roomba',color:0x4a4a4a,y:0.3,fact:'A Roomba is a robot vacuum that cleans floors by itself.'},
  {name:'Gearbot',color:0x9a7a5a,y:0.8,real:{url:'../assets/models/gears.glb',height:1.1},fact:'A gearbot shows how gears turn and help machines move.'}
];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1a2e);scene.fog=new THREE.Fog(0x1a1a2e,30,80);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,400);camera.position.set(0,9,28);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/studio-small.hdr",
  sky: 'gradient',
  skyOptions: { top: 0x14162e, bottom: 0x3a4070, sun: new THREE.Vector3(0.2, 0.6, -0.75), sunSize: 70 },
  bloom: 'glow'
});
window.fx = fx;/* HDR from Realism.setup provides the environment */KidLib.ambience('robo');
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.2,0);controls.maxDistance=45;controls.minDistance=5;
scene.add(new THREE.AmbientLight(0x6666aa,0.8));
const sun=new THREE.DirectionalLight(0xfff0d8,1.6);sun.position.set(10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8888cc,0x1a1a2e,0.5));
const floor=new THREE.Mesh(new THREE.CircleGeometry(24,48),new THREE.MeshStandardMaterial({color:0x2a2a4a,roughness:0.8}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// grid lines
(function(){for(let i=-4;i<=4;i++){const g=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.02,24),new THREE.MeshBasicMaterial({color:0x4a4a7a,transparent:true,opacity:0.5}));g.position.set(i*2,0.01,0);scene.add(g);const g2=new THREE.Mesh(new THREE.BoxGeometry(24,0.02,0.05),new THREE.MeshBasicMaterial({color:0x4a4a7a,transparent:true,opacity:0.5}));g2.position.set(0,0.01,i*2);scene.add(g2);}})();
function build(d){
  const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:d.color,roughness:0.4,metalness:0.3});const name=d.name;
  if(name==='Helper Bot'){const body=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,1.4,16),mat);body.position.y=0.9;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),mat);head.position.y=1.8;g.add(head);for(const s of [1,-1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10),new THREE.MeshStandardMaterial({color:0x8ff0ff,emissive:0x4fd0e0,emissiveIntensity:0.7}));eye.position.set(s*0.15,1.85,0.3);g.add(eye);}for(const s of [1,-1]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.8,8),mat);arm.position.set(s*0.7,1.0,0);arm.rotation.z=s*(-0.3);g.add(arm);}}
  else if(name==='Spot Robot'){for(let k=0;k<4;k++){const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.8,10),mat);const a=k/4*Math.PI*2;leg.position.set(Math.cos(a)*0.5,0.4,Math.sin(a)*0.5);leg.rotation.z=Math.cos(a)*0.3;leg.rotation.x=Math.sin(a)*0.3;g.add(leg);}const body=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.4,0.6),new THREE.MeshStandardMaterial({color:0xffb347,roughness:0.5}));body.position.y=0.9;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(0.25,14,14),new THREE.MeshStandardMaterial({color:0xffd166}));head.position.set(0.2,1.2,0);g.add(head);for(const s of [1,-1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(0.08,10,10),new THREE.MeshStandardMaterial({color:0x111}));eye.position.set(0.35,1.22,s*0.15);g.add(eye);}}
  else if(name==='Robot Arm'){const base=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.8,0.5,16),mat);base.position.y=0.25;base.castShadow=true;g.add(base);const p1=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2,10),mat);p1.position.y=1.3;p1.rotation.z=0.5;g.add(p1);const p2=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,1.4,10),mat);p2.position.set(1.0,2.0,0);p2.rotation.z=0.7;g.add(p2);const claw=new THREE.Mesh(new THREE.ConeGeometry(0.25,0.4,10),new THREE.MeshStandardMaterial({color:0xff8c3a}));claw.position.set(1.7,2.6,0);claw.rotation.z=Math.PI;g.add(claw);}
  else if(name==='Drone'){const body=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.2,0.6),mat);body.position.y=0.3;body.castShadow=true;g.add(body);for(let k=0;k<4;k++){const a=k/4*Math.PI*2;const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.8,8),mat);arm.position.set(Math.cos(a)*0.6,0.3,Math.sin(a)*0.6);arm.rotation.z=Math.cos(a)*0.5;arm.rotation.x=Math.sin(a)*0.5;g.add(arm);const prop=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.04,16),new THREE.MeshStandardMaterial({color:0xccc}));prop.position.set(Math.cos(a)*0.9,0.45,Math.sin(a)*0.9);g.add(prop);g.userData.props=g.userData.props||[];g.userData.props.push(prop);}}
  else if(name==='Roomba'){const body=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.2,24),mat);body.position.y=0.2;body.castShadow=true;g.add(body);const top=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.08,24),new THREE.MeshStandardMaterial({color:0x333}));top.position.y=0.3;g.add(top);const eye=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10),new THREE.MeshStandardMaterial({color:0x8ff0ff,emissive:0x4fd0e0,emissiveIntensity:0.7}));eye.position.set(0,0.35,0.6);g.add(eye);}
  else{const g1=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.25,20),mat);g1.position.set(-0.6,0.3,0);g1.rotation.z=Math.PI/2;g.add(g1);const g2=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.25,20),new THREE.MeshStandardMaterial({color:0xc88fff}));g2.position.set(0.6,0.3,0);g2.rotation.z=Math.PI/2;g.add(g2);const link=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1.2,8),mat);link.position.y=0.3;g.add(link);g.userData.gears=[g1,g2];}
  return g;
}
const bots=[];
DATA.forEach((d,i)=>{const g=build(d);const a=i/DATA.length*Math.PI*2;g.position.set(Math.cos(a)*8,d.y,Math.sin(a)*8);g.rotation.y=-a+Math.PI;const lbl=KidLib.makeLabel(d.name,{scale:1.2});lbl.position.y=d.y+1.9;g.add(lbl);scene.add(g);bots.push({data:d,group:g}); if(d.real){ ModelsLib.useReal(scene, g, d.real.url, { targetHeight: d.real.height, label: lbl }); }});
KidLib.pulse(scene, bots[0].group.position);
const strip=document.getElementById('strip');
bots.forEach((d,idx)=>{const b=document.createElement('button');b.className='btn';b.textContent=d.data.name;b.addEventListener('click',()=>showInfo(idx));strip.appendChild(b);});
const bubble=document.getElementById('bubble'),bTitle=document.getElementById('bTitle'),bText=document.getElementById('bText');
function showInfo(idx){const d=bots[idx];bTitle.textContent=d.data.name;bText.textContent=d.data.fact;bubble.classList.add('show');document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));strip.children[idx].classList.add('active');}
document.getElementById('bClose').onclick=()=>bubble.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${bTitle.textContent}. ${bText.textContent}`);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(scene.children,true);for(const h of hits){for(let i=0;i<bots.length;i++){if(bots[i].group.children.includes(h.object)){showInfo(i);return;}}}});
const clock=new THREE.Clock();
(function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();bots.forEach((d,i)=>{d.group.rotation.y+=0.005;const flying=d.data.name==='Drone';if(flying)d.group.position.y=d.data.y+Math.sin(t*1.5+i)*0.5;(d.group.userData.props||[]).forEach(p=>p.rotation.y=t*20);(d.group.userData.gears||[]).forEach((g2,gi)=>g2.rotation.z=t*4*(gi?1:-1));});controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera);})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
} catch(err){document.getElementById('err').style.display='block';document.getElementById('err').textContent='Oops! Something went wrong: '+err.message;}
</script>
<script>
const TIPS=['Robots are machines that follow instructions.','Some robots look like people, but most look different.','Robots can go where it is dangerous for people.','Gears are wheels with teeth that turn together.','Machines help us do work faster.'];
const QUIZ=[{q:'Which robot walks on four legs?',opts:['Spot','Roomba','Drone'],ans:0},{q:'Which robot flies?',opts:['Drone','Robot Arm','Helper Bot'],ans:0},{q:'Which robot vacuum cleans floors?',opts:['Roomba','Spot','Gearbot'],ans:0},{q:'What do gears do?',opts:['Turn and move machines','Sleep','Bark'],ans:0},{q:'Robots follow what?',opts:['Instructions','Dreams','Food'],ans:0}];
window.__MORE={'Helper Bot':['Helper bots are used in factories and homes.','They can do boring or heavy tasks.'],'Spot Robot':['Spot is used to inspect places people cannot reach.','It can climb stairs and walk on rough ground.'],'Robot Arm':['Robot arms are very precise.','They help build cars and electronics.'],'Drone':['Drones can take photos from the sky.','They are controlled from far away.'],'Roomba':['Roomba senses walls and turns around.','It returns to its charger when done.'],'Gearbot':['Gears change speed and direction.','Big gears turn small gears faster.' ]};
KidLib.init({tips:TIPS,quiz:QUIZ});
</script>
</body>
</html>
