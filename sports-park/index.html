<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sports Park — 3D Simulator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif;overflow:hidden;background:#5a9f6a;color:#fff}
  #app{position:fixed;inset:0}
  #err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#5a1020;border:3px solid #ff8f8f;padding:18px 24px;border-radius:14px;color:#ffd2d2;font-size:1rem;display:none;z-index:50;max-width:90vw}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  .title{font-size:1.4rem;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.45)}
  .sub{font-size:.85rem;color:#e0ffdc}
  .back{pointer-events:auto;text-decoration:none;color:#fff;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.4);padding:8px 14px;border-radius:999px;font-size:.9rem}
  .back:hover{background:rgba(0,0,0,.45)}
  .bubble{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:rgba(20,45,25,.97);border:3px solid rgba(160,240,160,.5);border-radius:24px;padding:18px 24px;max-width:min(90vw,440px);text-align:center;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  .bubble.show{opacity:1;pointer-events:auto}
  .bubble h3{font-size:1.35rem;margin-bottom:6px;color:#e0ffdc}
  .bubble p{font-size:1.05rem;line-height:1.5}
  .bubble .sound{margin-top:10px;background:#a8d878;color:#253a10;border:none;border-radius:999px;padding:10px 18px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
  .bubble .close{margin-left:8px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:999px;padding:10px 16px;font-size:1rem;cursor:pointer;font-family:inherit}
  .strip{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:15;flex-wrap:wrap;justify-content:center}
  .btn{padding:8px 14px;border-radius:999px;border:3px solid rgba(255,255,255,.4);cursor:pointer;background:rgba(25,50,25,.8);color:#fff;font-family:inherit;font-size:.9rem;font-weight:700;transition:transform .15s,border-color .15s}
  .btn:hover{transform:scale(1.08);border-color:#fff}
  .btn.active{border-color:#ffd166;box-shadow:0 0 12px rgba(255,209,102,.6)}
  .hint{position:fixed;bottom:142px;left:50%;transform:translateX(-50%);color:#e0ffdc;font-size:.85rem;text-align:center;z-index:12;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="app"></div><div id="err"></div>
<div class="hud"><div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/>
    <path d="m12 7.2 4 2.9-1.5 4.7h-5L8 10.1Z"/>
    <path d="M12 3v4.2M20.5 10.1 16 10.1M17.6 19.4l-3.1-4.6M6.4 19.4l3.1-4.6M3.5 10.1 8 10.1"/></svg>Sports Park<div class="sub">Tap a sport to learn about it</div></div><a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a></div>
<div class="bubble" id="bubble"><h3 id="bTitle"></h3><p id="bText"></p><div><button class="sound" id="bRead">🔊 Read aloud</button><button class="close" id="bClose">✕</button></div></div>
<div class="hint">Tap a sport or its button</div><div class="strip" id="strip"></div>
<link rel="stylesheet" href="../assets/kid-lib.css">
<script src="../assets/kid-lib.js"></script>
<script src="../assets/models-lib.js"></script>
<script type="importmap">{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;
try {
const DATA=[
  {name:'Soccer',color:0xffffff,y:0.7,fact:'Soccer is played with your feet. Players try to kick the ball into the goal.'},
  {name:'Basketball',color:0xff8c3a,y:0.8,fact:'Basketball is played with your hands, bouncing the ball and throwing it into a high hoop.'},
  {name:'Tennis',color:0xd8e84a,y:0.4,fact:'Tennis players hit a small ball over a net with a racket.'},
  {name:'Baseball',color:0xf0f0f0,y:0.3,fact:'Baseball players hit a hard ball with a bat and run around bases.'},
  {name:'Swimming',color:0x4a9fcf,y:0.4,real:{url:'../assets/models/pool.glb',height:0.9},fact:'Swimming is moving through water using your arms and legs.'},
  {name:'Running',color:0xe8e8e8,y:0.5,fact:'Running is fast moving using your legs. Races test who is fastest.'}
];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x5a9f6a);scene.fog=new THREE.Fog(0x5a9f6a,50,130);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,400);camera.position.set(0,8,28);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.98;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/sky-park-small.hdr",
  sky: 'gradient',
  skyOptions: { top: 0x3a86d8, bottom: 0xd6ecf5, sun: new THREE.Vector3(-0.35, 0.55, -0.75), sunSize: 120 },
  bloom: 'gentle'
});
window.fx = fx;/* HDR from Realism.setup provides the environment */KidLib.ambience('crowd');
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.5,0);controls.maxDistance=45;controls.minDistance=5;
scene.add(new THREE.AmbientLight(0xffffff,0.85));
const sun=new THREE.DirectionalLight(0xfff5d0,1.6);sun.position.set(10,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
scene.add(new THREE.HemisphereLight(0xe0ffdc,0x3a5a3a,0.5));
const ground=new THREE.Mesh(new THREE.CircleGeometry(26,56),new THREE.MeshStandardMaterial({color:0x4a8f4f,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// soccer field lines
(function(){const g=new THREE.Mesh(new THREE.CircleGeometry(8,48),new THREE.MeshStandardMaterial({color:0x3d8f4a,roughness:1}));g.rotation.x=-Math.PI/2;g.position.y=0.03;scene.add(g);})();
function build(d){
  const g=new THREE.Group(); const name=d.name;
  const white=0xf5f5f0, red=0xe84a4a, orange=0xff8c3a;
  const whiteMat=new THREE.MeshStandardMaterial({color:white,roughness:0.6});
  if(name==='Soccer'){
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.5,24,24),new THREE.MeshStandardMaterial({color:white,roughness:0.55})); ball.position.y=0.5; ball.castShadow=true; g.add(ball);
    // classic pentagon panels
    for(let k=0;k<12;k++){ const a=k/12*Math.PI*2; const p=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,10),new THREE.MeshStandardMaterial({color:0x222222,roughness:0.5})); p.position.set(Math.cos(a)*0.46,0.5+Math.sin(a)*0.25,Math.sin(a*1.7)*0.42); p.scale.set(1,0.5,1); g.add(p); }
    // goal with net
    const frame=new THREE.MeshStandardMaterial({color:white,roughness:0.5});
    for(const x of [-0.9,0.9]){ const post=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.4,10),frame); post.position.set(x,0.7,1.6); post.castShadow=true; g.add(post); }
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.8,10),frame); bar.rotation.z=Math.PI/2; bar.position.set(0,1.4,1.6); g.add(bar);
    for(let k=0;k<5;k++){ const net=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.02,0.02),new THREE.MeshBasicMaterial({color:0xdddddd,transparent:true,opacity:0.5})); net.position.set(0,0.2+k*0.3,1.6); g.add(net); }
    for(let k=0;k<5;k++){ const net=new THREE.Mesh(new THREE.BoxGeometry(0.02,1.4,0.02),new THREE.MeshBasicMaterial({color:0xdddddd,transparent:true,opacity:0.5})); net.position.set(-0.8+k*0.4,0.7,1.6); g.add(net); }
  }
  else if(name==='Basketball'){
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.45,24,24),new THREE.MeshStandardMaterial({color:orange,roughness:0.5})); ball.position.y=0.7; ball.castShadow=true; g.add(ball);
    for(let k=0;k<2;k++){ const seam=new THREE.Mesh(new THREE.TorusGeometry(0.45,0.025,8,32),new THREE.MeshStandardMaterial({color:0x5a2a12})); seam.rotation.y=Math.PI/2+k*Math.PI/2; g.add(seam); }
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,2.6,12),new THREE.MeshStandardMaterial({color:0x888c96,roughness:0.35,metalness:0.7})); pole.position.y=1.3; pole.castShadow=true; g.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.1,0.1),new THREE.MeshStandardMaterial({color:0x888c96,metalness:0.7})); arm.position.set(0.3,2.5,0); g.add(arm);
    const board=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.75,0.07),new THREE.MeshStandardMaterial({color:white,roughness:0.4})); board.position.set(0.55,2.2,0); board.castShadow=true; g.add(board);
    const square=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.28,0.02),new THREE.MeshStandardMaterial({color:orange,roughness:0.5})); square.position.set(0.55,2.05,0.05); g.add(square);
    const hoop=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.035,8,22),new THREE.MeshStandardMaterial({color:red,roughness:0.5})); hoop.position.set(0.55,1.9,0.15); hoop.rotation.x=Math.PI/2; g.add(hoop);
    for(let k=0;k<8;k++){ const a=k/8*Math.PI*2; const net=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.35,0.02),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.6})); net.position.set(0.55+Math.cos(a)*0.26,1.72,0.15+Math.sin(a)*0.26); g.add(net); }
  }
  else if(name==='Tennis'){
    const net=new THREE.Mesh(new THREE.BoxGeometry(3,0.55,0.03),new THREE.MeshBasicMaterial({color:0xf0f0f0,transparent:true,opacity:0.6})); net.position.y=0.42; g.add(net);
    for(let k=0;k<12;k++){ const mesh=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.55,0.02),new THREE.MeshBasicMaterial({color:0x333333})); mesh.position.set(-1.4+k*0.26,0.42,0.01); g.add(mesh); }
    for(const x of [-1.5,1.5]){ const post=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.9,8),new THREE.MeshStandardMaterial({color:0x4a4a52})); post.position.set(x,0.45,0); g.add(post); }
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.15,14,14),new THREE.MeshStandardMaterial({color:0xd8e84a,roughness:0.5})); ball.position.set(-0.8,0.4,0.4); ball.castShadow=true; g.add(ball);
    const seam=new THREE.Mesh(new THREE.TorusGeometry(0.15,0.012,6,18),new THREE.MeshStandardMaterial({color:white})); seam.position.copy(ball.position); g.add(seam);
    const racket=new THREE.Mesh(new THREE.TorusGeometry(0.26,0.028,8,22),new THREE.MeshStandardMaterial({color:0x4a6ab0,roughness:0.4,metalness:0.4})); racket.position.set(1.2,0.6,0.3); racket.rotation.y=0.5; racket.castShadow=true; g.add(racket);
    const strings=new THREE.Mesh(new THREE.CircleGeometry(0.24,20),new THREE.MeshBasicMaterial({color:0xf0f0f0,transparent:true,opacity:0.5,side:THREE.DoubleSide})); strings.position.copy(racket.position); strings.rotation.y=0.5; g.add(strings);
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.045,0.45,10),new THREE.MeshStandardMaterial({color:0x2a2a32})); grip.position.set(0.98,0.32,0.12); grip.rotation.z=0.8; g.add(grip);
  }
  else if(name==='Baseball'){
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.18,16,16),new THREE.MeshStandardMaterial({color:white,roughness:0.5})); ball.position.y=0.3; ball.castShadow=true; g.add(ball);
    const seam=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.015,6,18),new THREE.MeshStandardMaterial({color:red})); seam.position.copy(ball.position); seam.rotation.x=0.6; g.add(seam);
    const bat=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.085,1.1,12),new THREE.MeshStandardMaterial({color:0xd9a95a,roughness:0.7})); bat.position.set(0.8,0.5,0); bat.rotation.z=0.42; bat.castShadow=true; g.add(bat);
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.3,10),new THREE.MeshStandardMaterial({color:0x2a2a32})); grip.position.set(0.55,0.2,0); grip.rotation.z=0.42; g.add(grip);
    // bases
    for(const [x,z] of [[0,1.2],[1.2,0],[0,-1.2],[-1.2,0]]){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.1,0.42),whiteMat); b.position.set(x,0.05,z); b.rotation.y=Math.PI/4; b.receiveShadow=true; g.add(b); }
  }
  else if(name==='Swimming'){
    const pool=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.45,1.7),new THREE.MeshStandardMaterial({color:0x3f8fd0,roughness:0.4})); pool.position.y=0.22; pool.receiveShadow=true; g.add(pool);
    const water=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.16,1.5),new THREE.MeshStandardMaterial({color:0x88ccff,transparent:true,opacity:0.6,roughness:0.05,metalness:0.1})); water.position.y=0.44; g.add(water);
    const lane=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.02,1.5),new THREE.MeshBasicMaterial({color:0xf0f0f0,transparent:true,opacity:0.6})); lane.position.set(0,0.53,0); g.add(lane);
    for(const s of [1,-1]){ const rail=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2.6,8),new THREE.MeshStandardMaterial({color:0xc8ccd4,metalness:0.8,roughness:0.3})); rail.rotation.z=Math.PI/2; rail.position.set(0,0.5,s*0.85); g.add(rail); }
    const ladder=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.5,8),new THREE.MeshStandardMaterial({color:0xc8ccd4,metalness:0.8})); ladder.position.set(1.2,0.4,0.75); g.add(ladder);
  }
  else { // Running
    const track=new THREE.Mesh(new THREE.TorusGeometry(1.8,0.32,10,40),new THREE.MeshStandardMaterial({color:0xc86a4a,roughness:0.9})); track.rotation.x=Math.PI/2; track.position.y=0.06; track.receiveShadow=true; g.add(track);
    for(let k=0;k<4;k++){ const laneLine=new THREE.Mesh(new THREE.TorusGeometry(1.62+k*0.16,0.02,6,40),new THREE.MeshBasicMaterial({color:0xf0f0f0})); laneLine.rotation.x=Math.PI/2; laneLine.position.y=0.38; g.add(laneLine); }
    const runner=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,16),new THREE.MeshStandardMaterial({color:0xe84a4a,roughness:0.6})); runner.position.set(0,0.55,0); runner.castShadow=true; g.add(runner);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,14,14),new THREE.MeshStandardMaterial({color:0xf0c8a0,roughness:0.7})); head.position.set(0,0.95,0); g.add(head);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,10,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x2a6ad8})); cap.position.set(0,0.98,0); g.add(cap);
    for(const s of [1,-1]){ const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.07,0.3,4,8),new THREE.MeshStandardMaterial({color:0xf0c8a0})); arm.position.set(s*0.32,0.6,0); arm.rotation.z=s*0.7; g.add(arm); }
    for(const s of [1,-1]){ const leg=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.28,4,8),new THREE.MeshStandardMaterial({color:0x2a2a32})); leg.position.set(s*0.14,0.28,0); g.add(leg); }
  }
  return g;
}
const sports=[];
DATA.forEach((d,i)=>{const g=build(d);const a=i/DATA.length*Math.PI*2;g.position.set(Math.cos(a)*8,d.y,Math.sin(a)*8);g.rotation.y=-a+Math.PI;const lbl=KidLib.makeLabel(d.name,{scale:1.3});lbl.position.y=d.y+2.1;g.add(lbl);scene.add(g);sports.push({data:d,group:g}); if(d.real){ ModelsLib.useReal(scene, g, d.real.url, { targetHeight: d.real.height, label: lbl }); }});
KidLib.pulse(scene, sports[0].group.position);
const strip=document.getElementById('strip');
sports.forEach((d,idx)=>{const b=document.createElement('button');b.className='btn';b.textContent=d.data.name;b.addEventListener('click',()=>showInfo(idx));strip.appendChild(b);});
const bubble=document.getElementById('bubble'),bTitle=document.getElementById('bTitle'),bText=document.getElementById('bText');
function showInfo(idx){const d=sports[idx];bTitle.textContent=d.data.name;bText.textContent=d.data.fact;bubble.classList.add('show');document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));strip.children[idx].classList.add('active');}
document.getElementById('bClose').onclick=()=>bubble.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${bTitle.textContent}. ${bText.textContent}`);
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(scene.children,true);for(const h of hits){for(let i=0;i<sports.length;i++){if(sports[i].group.children.includes(h.object)){showInfo(i);return;}}}});
const clock=new THREE.Clock();
(function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();sports.forEach((d,i)=>{d.group.rotation.y+=0.005;d.group.position.y=d.data.y+Math.sin(t*0.6+i)*0.12;});controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera);})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
} catch(err){document.getElementById('err').style.display='block';document.getElementById('err').textContent='Oops! Something went wrong: '+err.message;}
</script>
<script>
const TIPS=['Sports keep our bodies strong and healthy.','Playing with others teaches teamwork.','Many sports need practice to get better.','Always warm up before playing.','Sports can be played in teams or alone.'];
const QUIZ=[{q:'Which sport is played with your feet?',opts:['Soccer','Basketball','Tennis'],ans:0},{q:'Which sport uses a hoop?',opts:['Basketball','Baseball','Swimming'],ans:0},{q:'Which sport uses a racket?',opts:['Tennis','Soccer','Running'],ans:0},{q:'In baseball, players run around?',opts:['Bases','Laps','Hoops'],ans:0},{q:'Swimming happens in?',opts:['Water','Sand','Air'],ans:0}];
window.__MORE={'Soccer':['Soccer is the most popular sport in the world.','Players cannot use their hands except goalkeepers.'],'Basketball':['The hoop is about 3 meters high.','You score by throwing the ball through the hoop.'],'Tennis':['Tennis can be played by two or four players.','The ball is small and yellow-green.'],'Baseball':['The pitcher throws, the batter hits.','A home run is when the batter runs all bases.'],'Swimming':['There are four main swimming strokes.','Swimming works many muscles at once.'],'Running':['Sprints are short and fast.','Long-distance running tests endurance.' ]};
KidLib.init({tips:TIPS,quiz:QUIZ});
</script>
</body>
</html>
