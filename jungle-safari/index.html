<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jungle Safari — 3D Simulator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif; overflow:hidden; background:#0f2a1a; color:#fff; }
  #app { position:fixed; inset:0; }
  #err { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#5a1020; border:3px solid #ff8f8f; padding:18px 24px; border-radius:14px; color:#ffd2d2; font-size:1rem; display:none; z-index:50; max-width:90vw; }
  .hud { position:fixed; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
  .title { font-size:1.4rem; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .sub { font-size:.85rem; color:#b8e0c0; }
  .back { pointer-events:auto; text-decoration:none; color:#fff; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.32); padding:8px 14px; border-radius:999px; font-size:.9rem; }
  .back:hover { background:rgba(255,255,255,.3); }
  .bubble { position:fixed; left:50%; bottom:210px; transform:translateX(-50%); background:rgba(12,32,20,.97); border:3px solid rgba(140,230,150,.45); border-radius:24px; padding:18px 24px; max-width:min(90vw,440px); text-align:center; z-index:20; box-shadow:0 10px 36px rgba(0,0,0,.7); opacity:0; pointer-events:none; transition:opacity .3s; }
  .bubble.show { opacity:1; pointer-events:auto; }
  .bubble h3 { font-size:1.35rem; margin-bottom:6px; color:#c8f0c8; }
  .bubble p { font-size:1.05rem; line-height:1.5; }
  .bubble .sound { margin-top:10px; background:#7fd18a; color:#0f2a14; border:none; border-radius:999px; padding:10px 18px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .bubble .close { margin-left:8px; background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px; padding:10px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  .strip { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:15; flex-wrap:wrap; justify-content:center; }
  .anim-btn { padding:8px 14px; border-radius:999px; border:3px solid rgba(255,255,255,.35); cursor:pointer; background:rgba(16,40,26,.85); color:#fff; font-family:inherit; font-size:.9rem; font-weight:700; transition:transform .15s, border-color .15s; }
  .anim-btn:hover { transform:scale(1.08); border-color:#fff; }
  .anim-btn.active { border-color:#7fd18a; box-shadow:0 0 12px rgba(127,209,138,.6); }
  .game { position:fixed; left:16px; top:70px; background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.3); border-radius:18px; padding:14px 16px; z-index:15; width:210px; }
  .game h3 { font-size:1rem; margin-bottom:8px; }
  .game .q { font-size:1.15rem; font-weight:700; color:#7fd18a; min-height:1.6em; }
  .game .score { font-size:1.3rem; font-weight:700; color:#ffd166; }
  .game .next { margin-top:10px; width:100%; background:#7fd18a; color:#0f2a14; border:none; border-radius:999px; padding:9px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .hint { position:fixed; bottom:142px; left:50%; transform:translateX(-50%); color:#b8e0c0; font-size:.85rem; text-align:center; z-index:12; pointer-events:none; text-shadow:0 1px 5px #000; }
</style>
</head>
<body>
<div id="app"></div>
<div id="err"></div>
<div class="hud">
  <div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5.2"/>
    <circle cx="9.8" cy="8" r="1"/>
    <circle cx="14.2" cy="8" r="1"/>
    <path d="M10.4 11.4c.9.8 2.3.8 3.2 0"/>
    <path d="M12 14.2V16"/>
    <path d="M9.2 16.4c.8-1 4.8-1 5.6 0"/>
    <path d="M3.5 21c2.6-2.2 5.4-3.2 8.5-3.2S17.9 18.8 20.5 21"/></svg>Jungle Safari<div class="sub">Drag to look around · tap an animal to learn</div></div>
  <a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a>
</div>
<div class="game">
  <h3>🔍 Spot the Animal</h3>
  <div class="q" id="q">Tap "Next" to play!</div>
  <div class="score" id="score">⭐ 0</div>
  <button class="next" id="nextBtn">Next ➡️</button>
</div>
<div class="bubble" id="bubble">
  <h3 id="bTitle"></h3><p id="bText"></p>
  <div><button class="sound" id="bRead">🔊 Sound</button><button class="close" id="bClose">✕</button></div>
</div>
<div class="hint">Tap an animal or its button</div>
<div class="strip" id="strip"></div>

<link rel="stylesheet" href="../assets/kid-lib.css">
<script type="importmap">
{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script src="../assets/kid-lib.js"></script>
<script src="../assets/models-lib.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;
try {

const DATA=[
  { name:'Lion', color:0xd9a95a, mane:0xb8792f, size:2.4, kind:'lion', sound:'roar', fact:'Lions live in groups called prides. The male lion has a big fluffy mane.' },
  { name:'Elephant', color:0x8a8a8a, size:3.8, kind:'elephant', sound:'trumpet', fact:'An elephant is the biggest land animal. It uses its long trunk to drink and grab food.' },
  { name:'Giraffe', color:0xe8c878, spot:0xb8863a, size:4.6, kind:'giraffe', sound:'hum', fact:'A giraffe is the tallest animal — its long neck lets it eat leaves at the top of trees.' },
  { name:'Monkey', color:0x8a6040, size:1.4, kind:'monkey', sound:'ooh', fact:'Monkeys are great climbers and swing from branch to branch using their tails and hands.' },
  { name:'Parrot', color:0x2f9f4f, wing:0xe85a2f, size:1.2, kind:'parrot', real:{url:'../assets/models/parrot.glb',height:0.75}, sound:'squawk', fact:'Parrots have bright feathers and some can learn to copy human words!' },
  { name:'Zebra', color:0xf0f0f0, stripe:0x1a1a1a, size:2.4, kind:'zebra', sound:'bark', fact:'No two zebras have the same stripes — like a fingerprint! Their stripes help them hide.' },
];

const actx=(()=>{ try{ return new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } })();
function playSound(kind){ if(!actx) return; if(actx.state==='suspended') actx.resume(); const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain(); o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.001,t0); g.gain.exponentialRampToValueAtTime(0.5,t0+0.03); g.gain.exponentialRampToValueAtTime(0.001,t0+0.8); o.type='sawtooth';
  if(kind==='roar'){ o.frequency.setValueAtTime(90,t0); o.frequency.linearRampToValueAtTime(60,t0+0.4); o.frequency.linearRampToValueAtTime(110,t0+0.7); }
  else if(kind==='trumpet'){ o.type='square'; let f=180; for(let i=0;i<4;i++){ o.frequency.setValueAtTime(f,t0+i*0.15); o.frequency.setValueAtTime(f*1.6,t0+i*0.15+0.06); f*=1.1; } }
  else if(kind==='hum'){ o.frequency.setValueAtTime(120,t0); o.frequency.linearRampToValueAtTime(90,t0+0.5); }
  else if(kind==='ooh'){ let f=500; for(let i=0;i<3;i++){ o.frequency.setValueAtTime(f,t0+i*0.18); o.frequency.linearRampToValueAtTime(f*1.6,t0+i*0.18+0.08); f*=1.2; } }
  else if(kind==='squawk'){ let f=700; for(let i=0;i<5;i++){ o.frequency.setValueAtTime(f,t0+i*0.1); o.frequency.setValueAtTime(f*0.6,t0+i*0.1+0.05); f*=1.15; } }
  else if(kind==='bark'){ let f=240; for(let i=0;i<2;i++){ o.frequency.setValueAtTime(f,t0+i*0.2); o.frequency.setValueAtTime(f*1.4,t0+i*0.2+0.06); } }
  o.start(t0); o.stop(t0+0.9); }

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f2a1a); scene.fog=new THREE.Fog(0x0f2a1a, 45, 120);
const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400); camera.position.set(0,11,40);
const renderer=new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.95;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/sky-park-small.hdr",
  sky: 'gradient',
  skyOptions: { top: 0x2f8f5a, bottom: 0xbfd8a8, sun: new THREE.Vector3(0.3, 0.6, -0.7), sunSize: 100 },
  bloom: 'gentle'
});
window.fx = fx;
/* HDR from Realism.setup provides the environment */
KidLib.ambience('forest');
const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.target.set(0,2.5,0); controls.maxDistance=70; controls.minDistance=6;

scene.add(new THREE.AmbientLight(0x88c088, 0.85));
const sunLight=new THREE.DirectionalLight(0xfff0cc, 1.7); sunLight.position.set(8,24,6); sunLight.castShadow=true; sunLight.shadow.mapSize.set(2048,2048); sunLight.shadow.camera.left=-30; sunLight.shadow.camera.right=30; sunLight.shadow.camera.top=30; sunLight.shadow.camera.bottom=-30; scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0xa8e0ac, 0x1a3a22, 0.55));

// textured ground
const groundTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d'); g.fillStyle='#2f5f2a'; g.fillRect(0,0,512,512); for(let i=0;i<2400;i++){ g.fillStyle=Math.random()<0.5?'rgba(20,50,18,0.25)':'rgba(70,120,60,0.2)'; g.beginPath(); g.arc(Math.random()*512,Math.random()*512,2+Math.random()*7,0,7); g.fill(); } const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t; })();
const ground=new THREE.Mesh(new THREE.CircleGeometry(42,64), new THREE.MeshStandardMaterial({ map:groundTex, roughness:1 })); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// leaf litter tufts
(function(){ const g=new THREE.BufferGeometry(); const pos=[]; for(let i=0;i<600;i++) pos.push((Math.random()-0.5)*70, 0.05, (Math.random()-0.5)*70); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x3f7f38, size:0.25 }))); })();

// thin canopy with sun-beams
const canopy=new THREE.Mesh(new THREE.CircleGeometry(38,64), new THREE.MeshBasicMaterial({ color:0x174a22, transparent:true, opacity:0.5, side:THREE.DoubleSide, depthWrite:false })); canopy.rotation.x=Math.PI/2; canopy.position.y=19; scene.add(canopy);
// birds circling overhead
const birds=[];
for(let i=0;i<7;i++){ const b=new THREE.Group(); const wingMat=new THREE.MeshStandardMaterial({ color:0x222222, side:THREE.DoubleSide }); for(const s of [1,-1]){ const wg=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.3), wingMat); wg.position.x=s*0.4; wg.rotation.y=Math.PI/2; wg.rotation.z=s*0.4; b.add(wg); b.userData.w=b.userData.w||[]; b.userData.w.push(wg); } b.position.set((Math.random()-0.5)*40, 10+Math.random()*4, (Math.random()-0.5)*40); scene.add(b); birds.push(b); }
(function(){ for(let i=0;i<6;i++){ const beam=new THREE.Mesh(new THREE.PlaneGeometry(3.5,16), new THREE.MeshBasicMaterial({ color:0xd8f0c0, transparent:true, opacity:0.10, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending })); beam.position.set((i-2.5)*6, 8, -6+Math.random()*8); beam.rotation.z=0.3; scene.add(beam); } })();

// jungle trees
(function(){ for(let n=0;n<14;n++){ const g=new THREE.Group(); const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.6,5,8), new THREE.MeshStandardMaterial({ color:0x4a3020, roughness:0.95 })); trunk.position.y=2.5; trunk.castShadow=true; g.add(trunk); const top=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16), new THREE.MeshStandardMaterial({ color:0x1f4f24, roughness:0.95 })); top.position.y=6.2; top.castShadow=true; g.add(top); const a=Math.random()*Math.PI*2, r=22+Math.random()*14; g.position.set(Math.cos(a)*r, 0, Math.sin(a)*r); scene.add(g); } })();

function buildAnimal(d){
  const builder=ModelsLib.BUILDERS[d.kind];
  if(!builder){ return {group:new THREE.Group(), anim:null}; }
  return builder(d);
}

function findAnimalRoot(obj){
  let o=obj;
  while(o){
    for(let i=0;i<animals.length;i++){ if(animals[i].group===o) return i; }
    o=o.parent;
  }
  return -1;
}

// place animals in an arc facing camera, with labels
const animals=[];
DATA.forEach((d,i)=>{ const built=buildAnimal(d); const g=built.group; g.scale.setScalar(d.size*0.34);
  const a=(i/DATA.length)*Math.PI*2;
  g.position.set(Math.cos(a)*10, 0, Math.sin(a)*8);
  g.rotation.y=-a+Math.PI;
  scene.add(g);
  const lbl=KidLib.makeLabel(d.name,{scale:1.4}); lbl.position.y=d.size*0.34*3.2; g.add(lbl);
  animals.push({data:d, group:g, anim:built.anim||null});
  if(d.real){ ModelsLib.useReal(scene, g, d.real.url, { targetHeight: d.real.height, label: lbl }); }
});

KidLib.pulse(scene, animals[0].group.position, 0x7fd18a);
const strip=document.getElementById('strip');
animals.forEach((d,idx)=>{ const b=document.createElement('button'); b.className='anim-btn'; b.textContent=d.data.name; b.addEventListener('click',()=>showInfo(idx)); strip.appendChild(b); });
const bubble=document.getElementById('bubble'), bTitle=document.getElementById('bTitle'), bText=document.getElementById('bText');
function showInfo(idx){ const d=animals[idx]; bTitle.textContent=d.data.name; bText.textContent=d.data.fact; bubble.classList.add('show'); playSound(d.data.sound); document.querySelectorAll('.anim-btn').forEach(x=>x.classList.remove('active')); strip.children[idx].classList.add('active'); }
document.getElementById('bClose').onclick=()=>bubble.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${bTitle.textContent}. ${bText.textContent}`);

const qEl=document.getElementById('q'), scoreEl=document.getElementById('score'), nextBtn=document.getElementById('nextBtn');
let score=0, target=-1;
function newRound(){ target=(Math.random()*animals.length)|0; qEl.textContent=`Find the ${animals[target].data.name}!`; }
newRound();
nextBtn.onclick=newRound;

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(scene.children,true); for(const h of hits){ const i=findAnimalRoot(h.object); if(i>=0){ if(i===target){ score++; scoreEl.textContent=`⭐ ${score}`; qEl.textContent=`✅ Great job! That's the ${animals[i].data.name}!`; } else { qEl.textContent=`❌ That's the ${animals[i].data.name}. Try again!`; }
    showInfo(i); return; } } });

const clock=new THREE.Clock();
(function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime();
  animals.forEach((d,i)=>{ if(d.anim){ d.anim(t,i); } else { d.group.rotation.y+=0.003; } });
  birds.forEach((b,i)=>{ b.position.y=10+Math.sin(t*0.8+i)*1.2; b.rotation.y=t*0.3+i; (b.userData.w||[]).forEach((wg,wi)=>wg.rotation.z=Math.sin(t*10+i)*0.5*(wi?1:-1)); });
  controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera); })();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
} catch(err){
  console.error('SAFARI ERROR:', err);
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent='Oops! Something went wrong loading the safari: '+err.message;
}
const TIPS=[
  'A savanna is a grassy plain with scattered trees.',
  'Many jungle animals are awake at night — they are nocturnal.',
  'Camouflage helps animals hide from predators.',
  'Jungles are warm and rainy, so plants grow very tall.',
  'Animals can be herbivores, carnivores, or omnivores.'
];
const QUIZ=[
  {q:'Which animal has a big fluffy mane?', opts:['Elephant','Lion','Zebra'], ans:1},
  {q:'Which is the tallest land animal?', opts:['Monkey','Parrot','Giraffe'], ans:2},
  {q:'Which animal has stripes?', opts:['Zebra','Lion','Elephant'], ans:0},
  {q:'Which animal eats leaves at the top of trees?', opts:['Giraffe','Monkey','Parrot'], ans:0},
  {q:'Lions live in groups called?', opts:['Prides','Dazzles','Troops'], ans:0}
];
window.__MORE={
  'Lion':['Lion cubs are born with spots that fade as they grow.','A lion\'s roar can be heard several kilometers away.'],
  'Elephant':['Elephants use their big ears to cool down.','They can remember places and friends for many years.'],
  'Giraffe':['A giraffe\'s tongue is very long and dark colored.','Giraffes have the same number of neck bones as humans — seven!'],
  'Monkey':['Monkeys live in family groups called troops.','Some monkeys use sticks as tools.'],
  'Parrot':['Parrots can live for many decades.','They use their strong curved beak to crack nuts.'],
  'Zebra':['A group of zebras is called a dazzle.','Zebras often sleep standing up.']
};
KidLib.init({tips:TIPS, quiz:QUIZ});
</script>
</body>
</html>
