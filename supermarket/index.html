<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Market — 3D Simulator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif; overflow:hidden; background:#d8e4f0; color:#1a2540; }
  #app { position:fixed; inset:0; }
  .hud { position:fixed; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
  .title { font-size:1.4rem; font-weight:700; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  .sub { font-size:.85rem; color:#e8f0ff; }
  .back { pointer-events:auto; text-decoration:none; color:#fff; background:rgba(0,0,0,.3); border:2px solid rgba(255,255,255,.5); padding:8px 14px; border-radius:999px; font-size:.9rem; }
  .back:hover { background:rgba(0,0,0,.5); }
  .panel { position:fixed; right:16px; top:70px; background:rgba(255,255,255,.95); border:2px solid rgba(26,37,64,.2); border-radius:18px; padding:14px 16px; z-index:15; width:220px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .panel h3 { font-size:1rem; margin-bottom:6px; }
  .basket { max-height:120px; overflow:auto; font-size:.88rem; color:#44506e; margin-bottom:8px; }
  .basket .row { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dashed #d5dced; }
  .total { font-size:1.4rem; font-weight:700; color:#c2452a; }
  .paylabel { font-size:.85rem; color:#44506e; margin-top:8px; }
  .paid { font-size:1.3rem; font-weight:700; color:#2a8f5a; }
  .coins { display:flex; gap:8px; margin:10px 0; }
  .coin { width:42px; height:42px; border-radius:50%; border:3px solid #b08a2a; background:radial-gradient(circle at 35% 35%, #ffdf8a, #d9a63a); color:#6b4e10; font-weight:700; font-size:.85rem; cursor:pointer; transition:transform .12s; display:flex; align-items:center; justify-content:center; }
  .coin:hover { transform:scale(1.15); }
  .pay { width:100%; background:#2a8f5a; color:#fff; border:none; border-radius:999px; padding:10px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .pay:disabled { opacity:.5; cursor:default; }
  .reset { width:100%; margin-top:8px; background:#e8ecf5; color:#44506e; border:none; border-radius:999px; padding:8px; font-size:.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .msg { position:fixed; left:50%; bottom:210px; transform:translateX(-50%); background:rgba(20,35,60,.96); border:3px solid rgba(255,255,255,.4); border-radius:24px; padding:16px 24px; max-width:min(90vw,420px); text-align:center; z-index:20; color:#fff; box-shadow:0 10px 36px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .3s; }
  .msg.show { opacity:1; pointer-events:auto; }
  .msg h3 { font-size:1.3rem; margin-bottom:4px; }
  .msg .close { margin-top:10px; background:#ffd166; color:#3a2b00; border:none; border-radius:999px; padding:9px 18px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .msg .sound { margin-top:10px; background:#7fd18a; color:#0f2a14; border:none; border-radius:999px; padding:9px 18px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div><div class="title"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2.2l2.4 11.2h11"/>
    <path d="M6.6 14.2 5 6.5h15.4l-1.8 7.7Z"/>
    <circle cx="9" cy="19" r="1.6"/>
    <circle cx="17" cy="19" r="1.6"/></svg>Smart Market<div class="sub">Click items to add them to your basket, then pay</div></div>
  <a class="back" href="../index.html"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg>Home</a>
</div>
<div class="panel">
  <h3>🧺 My basket</h3>
  <div class="basket" id="basket"><i>Basket is empty. Tap items!</i></div>
  <div class="total" id="total">Total: $0</div>
  <div class="paylabel">You pay:</div>
  <div class="paid" id="paid">$0</div>
  <div class="coins">
    <button class="coin" data-v="1">$1</button>
    <button class="coin" data-v="5">$5</button>
    <button class="coin" data-v="10">$10</button>
  </div>
  <button class="pay" id="payBtn">Pay 💵</button>
  <button class="reset" id="resetBtn">Start over</button>
</div>
<div class="msg" id="msg">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <button class="sound" id="bRead">🔊 Read aloud</button>
  <button class="close" id="mClose">Got it ✕</button>
</div>

<link rel="stylesheet" href="../assets/kid-lib.css">
<script type="importmap">
{ "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script src="../assets/kid-lib.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import '../assets/realism.js';
window.__THREE = THREE;

const ITEMS=[
  { name:'Apple', price:2, color:0xe83a3a, kind:'sphere', note:'An apple is a healthy fruit. It costs $2.' },
  { name:'Banana', price:1, color:0xffd166, kind:'banana', note:'A banana is yellow and curved. It is $1.' },
  { name:'Milk', price:4, color:0xf5f5f5, kind:'carton', note:'Milk comes from cows. It is good for strong bones. $4.' },
  { name:'Bread', price:3, color:0xd9a95a, kind:'bread', note:'Bread is made from wheat. It costs $3.' },
  { name:'Cookie', price:2, color:0xb8792f, kind:'sphere2', note:'A cookie is a sweet treat. It is $2.' },
  { name:'Toy Car', price:7, color:0x5ab5ff, kind:'car', note:'A toy car is fun to play with. It costs $7.' },
  { name:'Coffee Mug', price:4, color:0xd8d0c0, kind:'mug', note:'A warm mug of coffee helps grown-ups wake up! It costs $4.' },
];

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xd8e4f0); scene.fog=new THREE.Fog(0xd8e4f0, 30, 90);
const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400); camera.position.set(0,10,26);
const renderer=new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
document.getElementById('app').appendChild(renderer.domElement);
const fx = Realism.setup(scene, renderer, camera, {
  hdr: "../assets/hdr/studio-small.hdr",
  sky: 'gradient',
  skyOptions: { top: 0x4a5a7a, bottom: 0xc8d2e2, sun: new THREE.Vector3(0.2, 0.6, -0.75), sunSize: 80 },
  bloom: 'soft'
});
window.fx = fx;
/* HDR from Realism.setup provides the environment */
KidLib.ambience('city');
const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.target.set(0,2,0); controls.maxDistance=45; controls.minDistance=5;

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sunLight=new THREE.DirectionalLight(0xfff5d8, 1.4); sunLight.position.set(10,18,8); sunLight.castShadow=true; sunLight.shadow.mapSize.set(2048,2048); sunLight.shadow.camera.left=-20; sunLight.shadow.camera.right=20; sunLight.shadow.camera.top=20; sunLight.shadow.camera.bottom=-20; scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9ac0, 0.4));

const floor=new THREE.Mesh(new THREE.CircleGeometry(30,56), new THREE.MeshStandardMaterial({ color:0xc8d0e0, roughness:0.8 })); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// shelves
const shelfMat=new THREE.MeshStandardMaterial({ color:0x8a8f9a, roughness:0.7, metalness:0.3 });
ITEMS.forEach((it,i)=>{
  const shelf=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.BoxGeometry(3,2.6,0.4), shelfMat); frame.position.y=1.3; frame.castShadow=true; shelf.add(frame);
  const plank=new THREE.Mesh(new THREE.BoxGeometry(2.9,0.15,0.9), shelfMat); plank.position.y=1.0; shelf.add(plank);
  const a=(i/ITEMS.length)*Math.PI*2; const r=8.5;
  shelf.position.set(Math.cos(a)*r, 0, Math.sin(a)*r); shelf.rotation.y=-a;
  scene.add(shelf);
  // item display
  const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({ color:it.color, roughness:0.6 });
  if(it.kind==='sphere'){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.4,20,20), mat); m.position.y=1.5; g.add(m); }
  else if(it.kind==='sphere2'){ const m=new THREE.Mesh(new THREE.SphereGeometry(0.35,20,20), mat); m.position.y=1.5; m.scale.set(1,0.7,1); g.add(m); }
  else if(it.kind==='banana'){ const m=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.12,10,18), mat); m.position.y=1.5; m.rotation.z=0.5; g.add(m); }
  else if(it.kind==='carton'){ const m=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.7,0.4), mat); m.position.y=1.6; g.add(m); const top=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.15,0.35), new THREE.MeshStandardMaterial({ color:0x4a9f5a })); top.position.y=2.05; g.add(top); }
  else if(it.kind==='bread'){ const m=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.5), mat); m.position.y=1.6; m.rotation.z=0.2; g.add(m); }
  else { const m=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.4,0.4), mat); m.position.y=1.5; g.add(m); const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.1,12), new THREE.MeshStandardMaterial({ color:0x222222 })); wheel.rotation.z=Math.PI/2; wheel.position.set(-0.3,1.25,0.2); g.add(wheel); const w2=wheel.clone(); w2.position.set(-0.3,1.25,-0.2); g.add(w2); }
  g.userData.item=it; g.position.copy(shelf.position); g.position.y=0;
  const lbl=KidLib.makeLabel(it.name+' $'+it.price,{scale:1.0}); lbl.position.y=2.4; g.add(lbl);
  scene.add(g);
});

// checkout counter
const counter=new THREE.Mesh(new THREE.BoxGeometry(4,1,1.4), new THREE.MeshStandardMaterial({ color:0xb8c0d0, roughness:0.7 })); counter.position.set(0,0.5,-12); counter.castShadow=true; scene.add(counter);
KidLib.pulse(scene, new THREE.Vector3(0,1.5,-12), 0xffd166);

// basket state
const basket=document.getElementById('basket'), totalEl=document.getElementById('total'), paidEl=document.getElementById('paid'), payBtn=document.getElementById('payBtn'), resetBtn=document.getElementById('resetBtn');
let items=[], paid=0;
function render(){
  if(items.length===0) basket.innerHTML='<i>Basket is empty. Tap items!</i>';
  else basket.innerHTML=items.map(it=>`<div class="row"><span>${it.name}</span><span>$${it.price}</span></div>`).join('');
  const sum=items.reduce((a,b)=>a+b.price,0);
  totalEl.textContent=`Total: $${sum}`;
  paidEl.textContent=`$${paid}`;
  payBtn.disabled = items.length===0;
}
function addItem(it){ items.push(it); render(); showMsg(it.name, `${it.name} costs $${it.price}. ${it.note}`); }
function pay(){
  const sum=items.reduce((a,b)=>a+b.price,0);
  if(paid===sum){ const stars='⭐'.repeat(Math.min(3, items.length)); showMsg(`${stars} Thank you!`, `You paid exactly $${sum}. You are great at money math!`); items=[]; paid=0; render(); }
  else if(paid>sum){ showMsg('💵 You paid too much!', `That's $${paid-sum} too much. Use exact coins, or remove an item.`); }
  else { showMsg('❌ Not enough!', `You still need $${sum-paid} more. Add coins.`); }
}
document.querySelectorAll('.coin').forEach(c=>c.onclick=()=>{ paid+=parseInt(c.dataset.v,10); render(); });
payBtn.onclick=pay;
resetBtn.onclick=()=>{ items=[]; paid=0; render(); };

const msg=document.getElementById('msg'), mTitle=document.getElementById('mTitle'), mText=document.getElementById('mText');
function showMsg(t,txt){ mTitle.textContent=t; mText.textContent=txt; msg.classList.add('show'); }
document.getElementById('mClose').onclick=()=>msg.classList.remove('show');
document.getElementById('bRead').onclick=()=>KidLib.speak(`${mTitle.textContent}. ${mText.textContent}`);

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(scene.children,true); for(const h of hits){ const obj=h.object; let g=obj; while(g && !g.userData.item) g=g.parent; if(g && g.userData.item){ addItem(g.userData.item); return; } } });

const clock=new THREE.Clock();
(function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime(); controls.update(); if(window.KidLib)KidLib.updateLabels(scene,camera); fx.render(scene, camera); })();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
render();
const TIPS=[
  'Money can be coins and paper bills.',
  'A dollar is worth 100 cents.',
  'Counting coins helps us pay the right amount.',
  'Comparing prices helps us spend wisely.',
  'Always check your change after paying.'
];
const QUIZ=[
  {q:'Which item costs the most?', opts:['Apple','Toy Car','Banana'], ans:1},
  {q:'How much is a banana?', opts:['$1','$5','$10'], ans:0},
  {q:'You pay $5 for a $3 bread. Your change is?', opts:['$1','$2','$3'], ans:1},
  {q:'Which is worth more?', opts:['$1 coin','$5 bill','Both the same'], ans:1},
  {q:'Milk costs $4. Which coins pay it exactly?', opts:['Four $1s','Two $5s','One $10'], ans:0}
];
window.__MORE={
  'Apple':['Apples grow on trees.','They are a healthy snack full of vitamins.'],
  'Banana':['Bananas grow in bunches on big plants.','They come in their own natural wrapper!'],
  'Milk':['Milk gives our bones calcium.','It is usually kept cold in the store.'],
  'Bread':['Bread is made from wheat flour and water.','There are many kinds: white, brown, and more.'],
  'Cookie':['Cookies are baked in an oven.','They usually have sugar, flour, and butter.'],
  'Toy Car':['Toy cars come in many colors and sizes.','Some can even roll fast on the floor.']
};
KidLib.init({tips:TIPS, quiz:QUIZ});
</script>
</body>
</html>
